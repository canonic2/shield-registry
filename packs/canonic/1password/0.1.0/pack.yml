          ],
          "leading": {
            "flags": [
              "--help",
              "-h"
            ],
            "optional_values": [
              "--cache",
              "--debug",
              "--iso-timestamps",
              "--no-color"
            ],
            "values": [
              "--account",
              "--config",
              "--encoding",
              "--format",
              {
                "name": "--session"
