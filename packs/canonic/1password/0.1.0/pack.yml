      "reason": "Print the installed version or built-in help.",
      "conditions": {
        "domain": "argv",
        "executable": {
          "one_of": [
            "op",
            "op.exe",
            "/usr/bin/op",
            "/usr/local/bin/op",
            "/opt/homebrew/bin/op"
