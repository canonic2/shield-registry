  "version": "0.1.0",
  "license": "MIT",
  "maintainers": [
    "Canonic"
  ],
  "description": "1Password CLI metadata inspection with review for secret retrieval, injection, subprocesses, sharing, credentials and administrative changes.",
  "engines": {
    "shield": ">=0.53.0, <1.0.0"
  },
  "capabilities": [
    "argument-rules-v1",
    "interleaved-leading-v1",
