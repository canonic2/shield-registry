    {
      "id": "help",
      "decision": "allow",
      "reason": "Print built-in command help.",
      "conditions": {
        "domain": "argv",
        "executable": {
          "one_of": [
            "op",
            "op.exe",
            "/usr/bin/op",
            "/usr/local/bin/op",
            "/opt/homebrew/bin/op"
          ]
        },
        "arguments": {
          "kind": "sequence",
          "prefix": [
            "help"
          ],
          "rest": {
            "kind": "each",
            "match": {
              "regex": "^[a-z][a-z-]*$"
            },
            "max": 5
          }
        }
      }
    },
    {
      "id": "command-help",
      "decision": "allow",
      "reason": "Print help for a command family.",
      "conditions": {
        "domain": "argv",
        "executable": {
          "one_of": [
            "op",
            "op.exe",
            "/usr/bin/op",
            "/usr/local/bin/op",
            "/opt/homebrew/bin/op"
          ]
        },
        "arguments": {
          "kind": "sequence",
          "prefix": [
            {
              "one_of": [
                "account",
                "connect",
                "document",
                "environment",
                "events-api",
                "group",
                "item",
                "plugin",
                "provisioning",
                "service-account",
                "user",
                "vault",
                "completion",
                "inject",
                "read",
                "run",
                "signin",
                "signout",
                "update",
                "whoami"
              ]
            }
          ],
          "rest": {
            "kind": "each",
            "match": {
              "one_of": [
                "--help",
                "-h"
              ]
            },
            "min": 1,
            "max": 1
          }
        }
      }
    },
    {
      "id": "whoami",
      "decision": {
        "loose": "allow",
        "recommended": "allow",
        "strict": "ask"
      },
      "reason": "Inspect 1Password metadata using the selected account.",
      "conditions": {
        "domain": "argv",
        "executable": {
