{
  "schema_version": 1,
  "kind": "pack",
  "id": "canonic/apple",
  "version": "0.1.0",
  "license": "MIT",
  "maintainers": [
    "Canonic"
  ],
  "description": "Apple development: Xcode, Swift/SwiftPM, formatting/linting, CocoaPods, simulators/devices, signing, notarization and symbols, with checked paths and reviewed execution/publication.",
  "engines": {
    "shield": ">=0.53.0, <1.0.0"
  },
  "capabilities": [
    "structured-rules-v1",
    "argument-rules-v1",
    "argument-paths-v1",
    "location-v1",
    "access-paths-v1",
    "requirements-v1",
    "prefix-leading-v1",
    "interleaved-leading-v1",
    "unknown-options-v1"
  ],
