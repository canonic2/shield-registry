      "id": "xcodebuild-review",
      "conditions": {
        "domain": "argv",
        "executable": {
          "one_of": [
            "xcodebuild",
            "/usr/bin/xcodebuild",
            "/usr/local/bin/xcodebuild",
            "/opt/homebrew/bin/xcodebuild",
            "/Applications/Xcode.app/Contents/Developer/usr/bin/xcodebuild",
            "/Applications/Xcode.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin/xcodebuild"
          ]
        },
        "arguments": {
          "kind": "any"
        }
      },
      "decision": {
        "loose": "ask",
        "recommended": "ask",
        "strict": "deny"
      },
      "reason": "Review project schemes, package resolution, build scripts/macros, tests, signing/provisioning, export/upload destinations, runtime downloads and host setup."
    },
