{
  "schema_version": 1,
  "kind": "pack",
  "id": "canonic/baseline",
  "version": "0.9.0",
  "description": "Everyday commands, project builds and tests, and local file operations within approved paths; secret dumps, privilege and destructive system operations denied.",
  "license": "MIT",
  "maintainers": [
    "Canonic"
  ],
  "engines": {
    "shield": ">=0.2.0, <1.0.0"
  },
  "capabilities": [
    "access-paths-v1",
    "argument-rules-v1",
    "fallback-rules-v1",
    "location-v1",
    "regex-v1",
    "requirements-v1",
    "structured-rules-v1"
  ],
  "rules": [
    {
      "id": "shared-constant-true",
      "conditions": {
        "domain": "argv",
        "executable": {
          "one_of": [
            "true",
            "/bin/true",
            "/usr/bin/true",
            "false",
            "/bin/false",
            "/usr/bin/false",
            ":",
            "/bin/:",
            "/usr/bin/:",
            "date",
            "/bin/date",
            "/usr/bin/date"
          ]
        },
        "arguments": {
          "kind": "exact",
          "values": []
        }
      },
      "decision": {
        "loose": "allow",
        "recommended": "allow",
        "strict": "allow"
      }
    },
    {
      "id": "shared-text-echo",
      "conditions": {
        "domain": "argv",
        "executable": {
          "one_of": [
            "echo",
            "/bin/echo",
            "/usr/bin/echo",
            "printf",
            "/bin/printf",
            "/usr/bin/printf",
            "basename",
            "/bin/basename",
            "/usr/bin/basename",
            "dirname",
            "/bin/dirname",
            "/usr/bin/dirname"
          ]
        },
        "arguments": {
          "kind": "any"
        }
      },
      "decision": {
        "loose": "allow",
        "recommended": "allow",
        "strict": "allow"
      }
    },
    {
      "id": "pwd",
      "conditions": {
        "domain": "argv",
        "executable": {
          "one_of": [
            "pwd",
            "/bin/pwd",
            "/usr/bin/pwd"
          ]
        },
        "arguments": {
          "kind": "options",
          "prefix": [],
          "flags": [
            "-L",
            "-P"
          ],
          "values": [],
          "operands": false
        }
      },
      "decision": {
        "loose": "allow",
        "recommended": "allow",
        "strict": "allow"
      }
    },
    {
      "id": "uname",
      "conditions": {
        "domain": "argv",
        "executable": {
          "one_of": [
            "uname",
            "/bin/uname",
            "/usr/bin/uname"
          ]
        },
        "arguments": {
          "kind": "options",
          "prefix": [],
          "flags": [
            "-a",
            "-m",
            "-n",
            "-p",
            "-r",
            "-s",
            "-v"
          ],
          "values": [],
          "operands": false
        }
      },
      "decision": {
        "loose": "allow",
        "recommended": "allow",
        "strict": "allow"
      }
    },
    {
      "id": "sleep",
      "conditions": {
        "domain": "argv",
        "executable": {
          "one_of": [
            "sleep",
            "/bin/sleep",
            "/usr/bin/sleep"
          ]
        },
        "arguments": {
          "kind": "sequence",
          "prefix": [],
          "rest": {
            "kind": "each",
            "match": {
              "regex": "[0-9]+(?:\\.[0-9]+)?"
            },
            "min": 1,
            "max": 1
          }
        }
      },
      "decision": {
        "loose": "allow",
        "recommended": "allow",
        "strict": "allow"
      }
    },
    {
      "id": "stdin-cat",
      "conditions": {
        "domain": "argv",
        "executable": {
          "one_of": [
            "cat",
            "/bin/cat",
            "/usr/bin/cat"
          ]
        },
        "arguments": {
          "kind": "options",
          "prefix": [],
          "flags": [
            "-b",
            "-e",
            "-n",
            "-s",
            "-t",
            "-u",
            "-v",
            "-E",
            "-T"
          ],
          "values": [],
          "operands": false
        }
