    {
      "id": "read-cat",
      "conditions": {
        "domain": "argv",
        "executable": {
          "one_of": [
            "cat",
            "/bin/cat",
            "/usr/bin/cat"
          ]
        },
        "arguments": {
          "kind": "options",
          "prefix": [],
          "flags": [
            "-b",
            "-e",
            "-n",
            "-s",
            "-t",
            "-u",
            "-v",
            "-E",
            "-T"
          ],
          "values": [],
          "operands": {
            "match": {
              "regex": ".+"
            },
            "min": 1,
            "max": 256
          }
        }
      },
      "decision": {
        "loose": "allow",
        "recommended": "allow",
        "strict": "allow"
      },
      "requirements": {
        "targets": {
          "action": "read",
          "all": {
            "within": {
              "root": "read"
            },
            "exclude": [
              {
                "root": "read",
                "path": ".ssh"
              },
              {
                "root": "read",
                "path": ".aws"
              },
              {
                "root": "read",
                "path": ".config/gcloud"
              },
              {
                "root": "read",
                "path": ".kube"
              }
            ]
          }
        }
      },
      "on_unmet": {
        "decision": {
          "loose": "deny",
          "recommended": "deny",
          "strict": "deny"
        },
        "message": "Use supported literal options and approved paths; protected metadata and unverified targets are blocked.",
        "alternatives": [
          "To use a folder outside the project, propose it with shield_policy_propose (access_path_add); the user approves it with shield policy."
        ]
      }
    },
