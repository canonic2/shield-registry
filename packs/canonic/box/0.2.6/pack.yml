{
  "schema_version": 1,
  "kind": "pack",
  "id": "canonic/box",
  "version": "0.2.6",
  "description": "Box workspace inspection, content, checkouts and recipe runs, with separate decisions for arbitrary commands, agent conversations, resource deletion and agent configuration.",
  "license": "MIT",
  "maintainers": [
    "Canonic"
  ],
  "engines": {
    "shield": ">=0.20.0, <1.0.0"
  },
  "capabilities": [
    "access-paths-v1",
    "argument-paths-v1",
    "argument-rules-v1",
    "fallback-rules-v1",
    "field-negation-v1",
    "field-paths-v1",
    "interleaved-leading-v1",
    "location-v1",
    "mcp-integrations-v1",
    "negated-selectors-v1",
    "preconditions-v1",
    "prefix-leading-v1",
    "regex-v1",
    "requirements-v1",
    "structured-rules-v1",
    "unknown-options-v1"
  ],
  "mcp_integrations": {
    "box": {
      "transport": "stdio",
      "fields": {
        "/command": {
          "text": {
            "regex": "box|/usr/bin/box|/usr/local/bin/box|/opt/homebrew/bin/box|/(?:Users|home)/[A-Za-z0-9_][A-Za-z0-9_.-]*/\\.local/bin/box"
          }
        },
        "/args": {
          "exact": [
            "mcp",
            "serve"
          ]
        }
      },
      "defaults": {
        "type": "stdio",
        "command": "box",
        "args": [
          "mcp",
          "serve"
        ],
        "env": {}
      }
    }
  },
  "rules": [
