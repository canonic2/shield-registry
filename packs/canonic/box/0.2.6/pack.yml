          "kind": "options",
          "leading": {
            "flags": [
              "--json"
            ],
            "values": [
              "--project"
            ],
            "interleaved": true
          },
          "prefix": [
            "content",
            "export"
          ],
          "flags": [
            "--json"
          ],
          "values": [
            "--project",
            "--output"
          ],
          "operands": true,
          "unknown_options": "skip",
          "require_any": [
            "--output"
          ]
        },
        "cwd": {
          "within": {
            "root": "write"
          }
        }
      },
      "decision": {
        "loose": "allow",
        "recommended": "allow",
        "strict": "ask"
      },
      "reason": "Write the export to a named file, replacing it with --overwrite.",
      "requirements": {
        "argument_paths": {
          "grammar": {
            "kind": "options",
            "leading": {
              "flags": [
                "--json"
              ],
              "values": [
                "--project"
              ],
              "interleaved": true
            },
            "prefix": [
              "content",
              "export"
            ],
            "flags": [
              "--json",
              "--overwrite",
              "--project-wide"
            ],
            "values": [
              "--project",
              "--output",
              "--workspace",
              "--section",
              "--cursor",
              "--limit",
              "--format"
            ],
            "operands": false
          },
          "options": {
            "--output": {
              "path": {
                "within": {
                  "root": "write"
                },
                "exclude": [
                  {
                    "root": "project",
                    "path": ".shield"
                  },
                  {
                    "root": "project",
                    "path": ".git"
                  },
                  {
                    "root": "project",
                    "path": ".aws"
                  },
                  {
                    "root": "project",
                    "path": ".ssh"
                  },
                  {
                    "root": "project",
                    "path": ".env"
                  },
                  {
                    "root": "project",
                    "path": ".mcp.json"
                  },
                  {
                    "root": "project",
                    "path": ".codex"
                  },
                  {
                    "root": "project",
                    "path": ".claude"
                  }
                ]
              }
            }
          }
        }
      },
      "on_unmet": {
        "decision": "deny",
        "message": "Name a file inside the project, away from version control, credentials and agent settings."
      }
    },
