      "id": "version",
      "conditions": {
        "domain": "argv",
        "executable": {
          "one_of": [
            "box",
            "/usr/bin/box",
            "/usr/local/bin/box",
            "/opt/homebrew/bin/box"
          ]
        },
        "arguments": {
          "kind": "exact",
          "values": [
            "--version"
          ]
        }
      },
      "decision": {
        "loose": "allow",
        "recommended": "allow",
        "strict": "allow"
      },
      "reason": "Print the version or built-in help."
    },
