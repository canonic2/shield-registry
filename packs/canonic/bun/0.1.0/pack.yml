        },
        "arguments": {
          "kind": "risk_tokens",
          "prefix": [],
          "any_of": [
            "--eval",
            "-e",
            "--print",
            "-p",
            "--preload",
            "-r",
            "--require",
            "--import",
            "--cwd",
            "--config",
            "-c",
            "--env-file",
            "--cache-dir",
            "--global",
            "-g",
            "--registry",
            "--cafile",
            "--ca",
            "--fetch-preconnect",
            "--redis-preconnect",
            "--sql-preconnect",
            "--redirect-warnings",
            "--cpu-prof",
            "--cpu-prof-dir",
            "--heap-prof",
            "--heap-prof-dir",
            "--inspect",
            "--inspect-brk",
            "--inspect-wait",
            "--trust"
          ]
        }
