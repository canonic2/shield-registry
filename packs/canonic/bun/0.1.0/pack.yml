    {
      "id": "pm-list",
      "decision": {
        "loose": "allow",
        "recommended": "allow",
        "strict": "ask"
      },
      "reason": "Inspect local package metadata from an approved project directory.",
      "conditions": {
        "domain": "argv",
        "executable": {
          "one_of": [
            "bun",
            "/usr/bin/bun",
            "/usr/local/bin/bun",
            "/opt/homebrew/bin/bun",
            "bun.exe"
          ]
        },
        "arguments": {
          "kind": "options",
          "prefix": [
            "pm",
            {
              "one_of": [
                "ls",
                "list"
              ]
            }
          ],
          "flags": [],
          "values": [],
          "operands": true,
          "unknown_options": "skip"
        },
        "cwd": {
          "within": {
            "root": "project"
          },
          "exclude": [
            {
              "root": "project",
              "path": ".git"
