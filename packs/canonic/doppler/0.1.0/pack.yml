            "/usr/bin/doppler",
            "/usr/local/bin/doppler",
            "/opt/homebrew/bin/doppler"
          ]
        },
        "arguments": {
          "kind": "exact",
          "values": [
            "-v"
          ]
        }
      }
    },
    {
      "id": "cli-command-help",
      "decision": "allow",
      "reason": "Print help for a Doppler command.",
      "conditions": {
        "domain": "argv",
        "executable": {
          "one_of": [
            "doppler",
            "doppler.exe",
            "/usr/bin/doppler",
            "/usr/local/bin/doppler",
            "/opt/homebrew/bin/doppler"
          ]
        },
        "arguments": {
          "kind": "sequence",
          "prefix": [
            {
              "one_of": [
                "activity",
                "changelog",
                "completion",
                "configs",
                "configure",
                "environments",
                "feedback",
                "flags",
                "help",
                "import",
                "login",
                "logout",
                "me",
                "mfa",
                "oidc",
                "open",
                "projects",
                "run",
                "secrets",
                "settings",
                "setup",
                "tags",
                "tui",
                "update",
                "whoami",
                "enclave"
              ]
            }
          ],
          "rest": {
            "kind": "each",
            "match": {
              "one_of": [
                "--help",
                "-h"
              ]
            },
            "min": 1,
            "max": 1
          }
        }
      }
    },
    {
      "id": "cli-help",
      "decision": "allow",
      "reason": "Print help for a Doppler command path.",
      "conditions": {
        "domain": "argv",
        "executable": {
          "one_of": [
            "doppler",
            "doppler.exe",
            "/usr/bin/doppler",
            "/usr/local/bin/doppler",
            "/opt/homebrew/bin/doppler"
          ]
        },
        "arguments": {
          "kind": "sequence",
          "prefix": [
            "help"
          ],
          "rest": {
            "kind": "each",
            "match": {
              "regex": "^[a-z][a-z-]*$"
            },
            "max": 4
          }
        }
      }
    },
