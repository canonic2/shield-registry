{
  "schema_version": 1,
  "kind": "pack",
  "id": "canonic/doppler",
  "version": "0.1.0",
  "license": "MIT",
  "maintainers": [
    "Canonic"
  ],
  "description": "Doppler CLI and MCP metadata and secret-name inspection, with review for secret values, credential operations, injected commands and mutations.",
  "engines": {
    "shield": ">=0.53.0, <1.0.0"
  },
  "capabilities": [
    "argument-rules-v1",
    "interleaved-leading-v1",
    "location-v1",
    "mcp-integrations-v1",
    "negated-selectors-v1",
    "prefix-leading-v1",
    "regex-v1",
    "requirements-v1",
    "structured-rules-v1"
  ],
  "mcp_integrations": {
    "doppler": {
      "transport": "stdio",
      "fields": {
        "/command": {
          "text": {
            "one_of": [
              "npx",
              "npx.cmd",
              "/usr/bin/npx",
              "/usr/local/bin/npx",
              "/opt/homebrew/bin/npx"
            ]
          }
        },
        "/args/0": {
          "exact": "-y"
        },
        "/args/1": {
          "exact": "@dopplerhq/mcp-server@1.0.5"
        },
        "/env/DOPPLER_BASE_URL": {
          "exact": "https://api.doppler.com"
        }
      }
    }
  },
  "rules": [
    {
      "id": "cli-info-0",
      "decision": "allow",
      "reason": "Print CLI help or the installed version.",
      "conditions": {
        "domain": "argv",
        "executable": {
          "one_of": [
            "doppler",
            "doppler.exe",
            "/usr/bin/doppler",
            "/usr/local/bin/doppler",
            "/opt/homebrew/bin/doppler"
          ]
        },
        "arguments": {
          "kind": "exact",
          "values": [
            "--help"
          ]
        }
      }
    },
    {
      "id": "cli-info-1",
      "decision": "allow",
      "reason": "Print CLI help or the installed version.",
