        "domain": "argv",
        "executable": "git",
        "arguments": {
          "kind": "any"
        }
      },
      "reason": "Review unclassified options or operations before permitting their effects.",
      "decision": {
        "loose": "ask",
        "recommended": "ask",
        "strict": "ask"
      },
      "invocation": "git",
      "command_set": "baseline-0"
    },
    {
      "id": "baseline-1",
      "conditions": {
        "domain": "argv",
        "executable": "git",
        "arguments": {
          "kind": "any"
        }
      },
      "reason": "Review remote access, publication or transport/helper execution; Strict denies these operations.",
      "decision": {
        "loose": "ask",
        "recommended": "ask",
        "strict": "deny"
      },
      "invocation": "git",
      "command_set": "baseline-1"
    },
    {
      "id": "baseline-2",
      "conditions": {
        "domain": "argv",
        "executable": "git",
        "arguments": {
          "kind": "any"
        }
      },
      "reason": "May discard data, rewrite history, run external code or change sensitive storage; Recommended and Strict deny.",
      "decision": {
        "loose": "ask",
        "recommended": "deny",
        "strict": "deny"
      },
      "invocation": "git",
      "command_set": "baseline-2"
    },
    {
      "id": "baseline-3",
