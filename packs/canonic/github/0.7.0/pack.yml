  "mcp_integrations": {
    "hosted": {
      "transport": "http",
      "fields": {
        "/url": {
          "exact": "https://api.githubcopilot.com/mcp/"
        }
      },
      "defaults": {
        "type": "http",
        "url": "https://api.githubcopilot.com/mcp/"
      }
    },
    "local": {
      "transport": "stdio",
      "fields": {
        "/command": {
          "text": {
            "one_of": [
              "github-mcp-server",
              "/usr/bin/github-mcp-server",
              "/usr/local/bin/github-mcp-server",
              "/opt/homebrew/bin/github-mcp-server"
            ]
          }
        },
        "/args": {
          "exact": [
            "stdio"
          ]
        }
      },
      "defaults": {
        "type": "stdio",
        "command": "github-mcp-server",
        "args": [
          "stdio"
        ],
        "env": {}
      }
    },
    "local-read-only": {
      "transport": "stdio",
      "fields": {
        "/command": {
          "text": {
            "one_of": [
              "github-mcp-server",
              "/usr/bin/github-mcp-server",
              "/usr/local/bin/github-mcp-server",
              "/opt/homebrew/bin/github-mcp-server"
            ]
          }
        },
        "/args": {
          "exact": [
            "stdio",
            "--read-only"
          ]
        }
      },
      "defaults": {
        "type": "stdio",
        "command": "github-mcp-server",
        "args": [
          "stdio",
          "--read-only"
        ],
        "env": {}
      }
    }
