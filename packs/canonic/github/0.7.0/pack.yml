{
  "schema_version": 1,
  "kind": "pack",
  "id": "canonic/github",
  "version": "0.7.0",
  "description": "GitHub CLI and official MCP permissions. Optional repository setting restricts both to one explicit OWNER/REPO; omitted means no repository restriction.",
  "license": "MIT",
  "maintainers": [
    "Canonic"
  ],
  "engines": {
    "shield": ">=0.31.0, <1.0.0"
  },
  "capabilities": [
    "structured-rules-v1",
    "argument-rules-v1",
    "prefix-leading-v1",
    "interleaved-leading-v1",
    "regex-v1",
    "negated-selectors-v1",
    "unknown-options-v1",
    "preconditions-v1",
    "glob-v1",
    "fallback-rules-v1",
    "mcp-integrations-v1",
    "variables-v1",
    "variable-parts-v1",
    "graphql-v1",
    "templates-v1",
    "variable-prefixes-v1",
    "graphql-mutations-v1"
