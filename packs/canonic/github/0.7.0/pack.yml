                }
              }
            },
            {
              "name": "--template",
              "match": {
                "not": {
                  "regex": "(?s:.*(?:\\benv\\b|\\$ENV\\b|\\binclude\\b|\\bimport\\b).*)"
                }
              }
            }
          ],
          "operands": {
            "match": {
              "prefix": [
                "repos/",
                {
                  "var": "repository"
                },
                "/"
              ]
            },
            "min": 1,
            "max": 1
          }
        }
      },
      "requires_any": [
        {
          "arguments": {
            "kind": "options",
            "prefix": [
              "api"
            ],
            "flags": [
              "--paginate",
              "--slurp",
              "-i",
              "--include",
              "--silent",
              "--verbose"
            ],
            "values": [
              {
                "name": "-X",
                "match": "GET"
              },
              {
                "name": "--method",
                "match": "GET"
              },
              {
                "name": "-q",
                "match": {
                  "not": {
                    "regex": "(?s:.*(?:\\benv\\b|\\$ENV\\b|\\binclude\\b|\\bimport\\b).*)"
                  }
                }
              },
              {
                "name": "--jq",
