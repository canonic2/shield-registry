{
  "schema_version": 1,
  "kind": "pack",
  "id": "canonic/hub",
  "version": "0.1.9",
  "description": "Hub workspaces, tasks, processes, agents, configuration and hosted proxies, with review for arbitrary commands, agent prompts, self-confirmed deletion, credential files and public route changes.",
  "license": "MIT",
  "maintainers": [
    "Canonic"
  ],
  "engines": {
    "shield": ">=0.20.0, <1.0.0"
  },
  "capabilities": [
    "access-paths-v1",
    "argument-paths-v1",
    "argument-rules-v1",
    "fallback-rules-v1",
    "field-paths-v1",
    "interleaved-leading-v1",
    "location-v1",
    "mcp-integrations-v1",
    "negated-selectors-v1",
    "preconditions-v1",
    "prefix-leading-v1",
    "regex-v1",
    "requirements-v1",
    "structured-rules-v1",
    "unknown-options-v1"
  ],
  "mcp_integrations": {
    "hub": {
      "transport": "stdio",
      "fields": {
        "/command": {
          "text": {
            "regex": "hub|/usr/bin/hub|/usr/local/bin/hub|/opt/homebrew/bin/hub|/(?:Users|home)/[A-Za-z0-9_][A-Za-z0-9_.-]*/\\.local/bin/hub"
          }
        },
        "/args": {
          "exact": [
            "mcp",
            "serve"
          ]
        }
      },
      "defaults": {
        "type": "stdio",
        "command": "hub",
        "args": [
          "mcp",
          "serve"
        ],
        "env": {}
      }
    }
  },
  "rules": [
    {
      "id": "version",
      "conditions": {
        "domain": "argv",
        "executable": {
          "one_of": [
            "hub",
            "/usr/bin/hub",
            "/usr/local/bin/hub",
            "/opt/homebrew/bin/hub"
          ]
        },
        "arguments": {
          "kind": "exact",
          "values": [
            "--version"
          ]
        }
      },
      "decision": {
        "loose": "allow",
        "recommended": "allow",
        "strict": "allow"
      },
      "reason": "Print the version or built-in help."
    },
    {
