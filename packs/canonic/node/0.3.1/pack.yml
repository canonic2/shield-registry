{
  "schema_version": 1,
  "kind": "pack",
  "id": "canonic/node",
  "version": "0.3.1",
  "description": "Node development with optional npm/pnpm/Yarn selection, local installs and inspection; project scripts require project policy review.",
  "license": "MIT",
  "maintainers": [
    "Canonic"
  ],
  "engines": {
    "shield": ">=0.7.0, <1.0.0"
  },
  "capabilities": [
    "argument-rules-v1",
    "directory-options-v1",
    "fallback-rules-v1",
    "location-v1",
    "preconditions-v1",
    "prefix-leading-v1",
    "regex-v1",
    "structured-rules-v1",
    "templates-v1",
    "variables-v1"
  ],
  "variables": {
    "package_manager": {
      "type": "choice",
      "description": "Package manager agents must use; leave unset to permit any supported manager.",
      "values": [
        "npm",
        "pnpm",
        "yarn"
      ],
      "setup": {
        "question": "Require a specific package manager?",
        "unset": "Any supported package manager"
      },
      "suggest": [
        {
          "file": "pnpm-lock.yaml",
          "value": "pnpm"
        },
        {
          "file": "yarn.lock",
          "value": "yarn"
        },
        {
          "file": "package-lock.json",
          "value": "npm"
        }
      ]
    }
  },
  "preconditions": [
    {
      "id": "manager-npm",
      "when": [
        {
          "var": "package_manager",
          "equals": "npm"
        }
      ],
      "conditions": {
        "domain": "argv",
        "executable": {
          "one_of": [
            "npm",
            "/bin/npm",
            "/usr/bin/npm",
            "/usr/local/bin/npm",
            "/opt/homebrew/bin/npm",
            "npx",
            "/bin/npx",
            "/usr/bin/npx",
            "/usr/local/bin/npx",
            "/opt/homebrew/bin/npx",
            "pnpm",
            "/bin/pnpm",
            "/usr/bin/pnpm",
            "/usr/local/bin/pnpm",
            "/opt/homebrew/bin/pnpm",
            "pn",
            "/bin/pn",
            "/usr/bin/pn",
            "/usr/local/bin/pn",
            "/opt/homebrew/bin/pn",
            "pnpx",
            "/bin/pnpx",
            "/usr/bin/pnpx",
            "/usr/local/bin/pnpx",
            "/opt/homebrew/bin/pnpx",
            "pnx",
            "/bin/pnx",
            "/usr/bin/pnx",
            "/usr/local/bin/pnx",
            "/opt/homebrew/bin/pnx",
            "yarn",
            "/bin/yarn",
            "/usr/bin/yarn",
            "/usr/local/bin/yarn",
            "/opt/homebrew/bin/yarn",
            "yarnpkg",
            "/bin/yarnpkg",
            "/usr/bin/yarnpkg",
            "/usr/local/bin/yarnpkg",
            "/opt/homebrew/bin/yarnpkg"
          ]
        }
      },
      "requires_any": [
        {
          "executable": {
            "one_of": [
              "npm",
              "/bin/npm",
              "/usr/bin/npm",
              "/usr/local/bin/npm",
              "/opt/homebrew/bin/npm",
              "npx",
              "/bin/npx",
              "/usr/bin/npx",
              "/usr/local/bin/npx",
              "/opt/homebrew/bin/npx"
            ]
          }
        }
      ],
      "on_unmet": {
        "decision": "deny",
        "message": "This project uses {{package_manager}}. Use {{package_manager}} instead.",
        "alternatives": [
          "Use {{package_manager}} for this operation."
        ]
      }
    },
    {
      "id": "corepack-manager-npm",
      "when": [
        {
          "var": "package_manager",
          "equals": "npm"
        }
      ],
      "conditions": {
        "domain": "argv",
        "executable": {
          "one_of": [
            "corepack",
            "/bin/corepack",
            "/usr/bin/corepack",
            "/usr/local/bin/corepack",
            "/opt/homebrew/bin/corepack"
          ]
        }
      },
      "requires_any": [
        {
          "arguments": {
            "kind": "prefix",
            "values": [
              {
                "var": "package_manager"
              }
            ]
          }
        },
        {
          "arguments": {
            "kind": "prefix",
            "values": [
              "npx"
            ]
          }
        },
        {
          "arguments": {
            "kind": "exact",
            "values": [
              "--version"
            ]
          }
        },
        {
          "arguments": {
            "kind": "exact",
            "values": [
              "-v"
            ]
          }
        },
        {
          "arguments": {
            "kind": "exact",
            "values": [
              "--help"
            ]
          }
        },
        {
          "arguments": {
            "kind": "exact",
            "values": [
              "-h"
            ]
          }
        }
      ],
      "on_unmet": {
        "decision": "deny",
        "message": "This project uses {{package_manager}}. Use {{package_manager}} directly or corepack {{package_manager}}; unqualified Corepack setup cannot verify the selected manager.",
        "alternatives": [
          "Use {{package_manager}} for this operation."
        ]
      }
    },
