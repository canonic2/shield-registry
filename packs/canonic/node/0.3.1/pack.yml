  "rules": [
    {
      "id": "version-help",
      "conditions": {
        "domain": "argv",
        "executable": {
          "one_of": [
            "node",
            "/bin/node",
            "/usr/bin/node",
            "/usr/local/bin/node",
            "/opt/homebrew/bin/node",
            "npm",
            "/bin/npm",
            "/usr/bin/npm",
            "/usr/local/bin/npm",
            "/opt/homebrew/bin/npm",
            "npx",
            "/bin/npx",
            "/usr/bin/npx",
            "/usr/local/bin/npx",
            "/opt/homebrew/bin/npx",
            "pnpm",
            "/bin/pnpm",
            "/usr/bin/pnpm",
            "/usr/local/bin/pnpm",
            "/opt/homebrew/bin/pnpm",
            "pn",
            "/bin/pn",
            "/usr/bin/pn",
            "/usr/local/bin/pn",
            "/opt/homebrew/bin/pn",
            "pnpx",
            "/bin/pnpx",
            "/usr/bin/pnpx",
            "/usr/local/bin/pnpx",
            "/opt/homebrew/bin/pnpx",
            "pnx",
            "/bin/pnx",
            "/usr/bin/pnx",
            "/usr/local/bin/pnx",
            "/opt/homebrew/bin/pnx",
            "yarn",
            "/bin/yarn",
            "/usr/bin/yarn",
            "/usr/local/bin/yarn",
            "/opt/homebrew/bin/yarn",
            "yarnpkg",
            "/bin/yarnpkg",
            "/usr/bin/yarnpkg",
            "/usr/local/bin/yarnpkg",
            "/opt/homebrew/bin/yarnpkg",
            "corepack",
            "/bin/corepack",
            "/usr/bin/corepack",
            "/usr/local/bin/corepack",
            "/opt/homebrew/bin/corepack"
          ]
        },
        "arguments": {
          "kind": "sequence",
          "prefix": [
            {
              "one_of": [
                "--version",
                "-v",
                "--help",
                "-h"
              ]
            }
          ],
          "rest": {
            "kind": "none"
          }
        }
      },
      "decision": {
        "loose": "allow",
        "recommended": "allow",
        "strict": "allow"
      },
      "reason": "Inspect version or help using the configured executable."
    },
    {
      "id": "npm-help",
      "conditions": {
        "domain": "argv",
        "executable": {
          "one_of": [
            "npm",
            "/bin/npm",
            "/usr/bin/npm",
            "/usr/local/bin/npm",
            "/opt/homebrew/bin/npm"
          ]
        },
        "arguments": {
          "kind": "options",
          "prefix": [
            "help"
          ],
          "flags": [],
          "values": [],
          "operands": {
            "match": {
              "regex": "[a-z][a-z-]*"
            },
            "min": 0,
            "max": 1
          }
        }
      },
      "decision": {
        "loose": "allow",
        "recommended": "allow",
        "strict": "allow"
      },
      "reason": "Read npm help; the configured help viewer is trusted."
    },
    {
      "id": "npm-metadata",
      "conditions": {
        "domain": "argv",
        "executable": {
          "one_of": [
            "npm",
            "/bin/npm",
            "/usr/bin/npm",
            "/usr/local/bin/npm",
            "/opt/homebrew/bin/npm"
          ]
        },
        "arguments": {
          "kind": "options",
          "prefix": [
            {
              "one_of": [
                "view",
                "info",
                "show",
                "v"
              ]
            }
          ],
          "flags": [
            "--json"
          ],
          "values": [],
          "operands": {
            "match": {
              "regex": "[a-zA-Z0-9@][a-zA-Z0-9@/._~^*+<>=|-]*"
            },
            "min": 1,
            "max": 8
          }
        }
      },
      "decision": {
        "loose": "allow",
        "recommended": "allow",
        "strict": "allow"
      },
      "reason": "Query package metadata from the configured registry; this may access the network and use configured credentials."
    },
    {
      "id": "npm-init",
      "conditions": {
        "domain": "argv",
        "executable": {
          "one_of": [
            "npm",
            "/bin/npm",
            "/usr/bin/npm",
            "/usr/local/bin/npm",
            "/opt/homebrew/bin/npm"
          ]
        },
        "arguments": {
          "kind": "options",
          "prefix": [
            "init"
          ],
          "flags": [
            "-y",
            "--yes"
          ],
          "values": [],
          "operands": false
        },
        "cwd": {
          "within": {
            "root": "project"
          }
        }
      },
      "decision": {
        "loose": "allow",
        "recommended": "allow",
        "strict": "ask"
      },
      "reason": "Create a default project manifest; npm initializers naming packages require separate review."
    },
    {
      "id": "npm-scripts",
      "conditions": {
        "domain": "argv",
        "executable": {
          "one_of": [
            "npm",
            "/bin/npm",
            "/usr/bin/npm",
            "/usr/local/bin/npm",
            "/opt/homebrew/bin/npm"
          ]
        },
        "arguments": {
          "kind": "prefix",
          "values": [
            {
              "one_of": [
                "run",
                "run-script",
                "test",
                "t",
                "start",
                "stop",
                "restart"
              ]
            }
          ]
        }
      },
      "decision": {
        "loose": "ask",
        "recommended": "ask",
        "strict": "ask"
      },
      "reason": "Project scripts need an explicit project rule.",
      "guidance": {
        "message": "Project scripts require project policy review; a script name does not establish harmlessness.",
        "alternatives": [
          "Inspect script definitions, hooks and arguments. If appropriate, propose a narrow project rule with shield_policy_propose and explain its effects in agent_reason. Submit its exact apply_arguments to shield_policy_apply for user review."
        ]
      }
    },
    {
      "id": "npm-inspect-project",
      "conditions": {
        "domain": "argv",
        "executable": {
          "one_of": [
            "npm",
            "/bin/npm",
            "/usr/bin/npm",
            "/usr/local/bin/npm",
            "/opt/homebrew/bin/npm"
          ]
        },
        "arguments": {
          "kind": "options",
          "prefix": [
            {
              "one_of": [
                "ls",
                "list",
                "outdated",
                "explain",
                "why"
              ]
            }
          ],
          "flags": [
            "--json",
            "--all"
          ],
          "values": [
            {
              "name": "--depth",
              "match": "0"
            }
          ],
          "operands": {
            "match": {
              "regex": "(?:@[a-zA-Z0-9._~-]+/)?[a-zA-Z0-9][a-zA-Z0-9._~-]*(?:@[^\\s]+)?"
            },
            "min": 0,
            "max": 8
          }
        },
        "cwd": {
          "within": {
            "root": "project"
          }
        }
      },
      "decision": {
        "loose": "allow",
        "recommended": "allow",
        "strict": "allow"
      },
      "reason": "Inspect project dependency metadata."
    },
    {
      "id": "npm-audit",
      "conditions": {
        "domain": "argv",
        "executable": {
          "one_of": [
            "npm",
            "/bin/npm",
            "/usr/bin/npm",
            "/usr/local/bin/npm",
            "/opt/homebrew/bin/npm"
          ]
        },
        "arguments": {
          "kind": "options",
          "prefix": [
            "audit"
          ],
          "flags": [
            "--json"
          ],
          "values": [
            {
              "name": "--omit",
              "match": {
                "one_of": [
                  "dev",
                  "optional",
                  "peer"
                ]
              }
            }
          ],
          "operands": false
        },
        "cwd": {
          "within": {
            "root": "project"
          }
        }
      },
      "decision": {
        "loose": "allow",
        "recommended": "allow",
        "strict": "allow"
      },
      "reason": "Request a dependency vulnerability report from the configured registry; no fixes or registry overrides."
    },
    {
      "id": "npm-install",
      "conditions": {
        "domain": "argv",
        "executable": {
          "one_of": [
            "npm",
            "/bin/npm",
            "/usr/bin/npm",
            "/usr/local/bin/npm",
            "/opt/homebrew/bin/npm"
          ]
        },
        "arguments": {
          "kind": "options",
          "prefix": [
            {
              "one_of": [
                "install",
                "i",
                "ci"
              ]
            }
          ],
          "flags": [
            "--save-dev",
            "-D",
            "--save-exact",
            "-E",
            "--ignore-scripts",
            "--no-audit",
            "--no-fund"
          ],
          "values": [],
          "operands": false
        },
        "cwd": {
          "within": {
            "root": "project"
          }
        }
      },
      "decision": {
        "loose": "allow",
        "recommended": "allow",
        "strict": "deny"
      },
      "reason": "Install the dependencies the manifest and lockfile already declare. Lifecycle scripts run; --ignore-scripts does not establish full execution containment."
    },
    {
      "id": "npm-install-add",
      "conditions": {
        "domain": "argv",
        "executable": {
          "one_of": [
            "npm",
            "/bin/npm",
            "/usr/bin/npm",
            "/usr/local/bin/npm",
            "/opt/homebrew/bin/npm"
          ]
        },
        "arguments": {
          "kind": "options",
          "prefix": [
            {
              "one_of": [
                "install",
                "i",
                "add"
              ]
            }
          ],
          "flags": [
            "--save-dev",
            "-D",
            "--save-exact",
            "-E",
            "--ignore-scripts",
            "--no-audit",
            "--no-fund"
          ],
          "values": [],
          "operands": {
            "match": {
              "regex": "(?:@[a-zA-Z0-9._~-]+/)?[a-zA-Z0-9][a-zA-Z0-9._~-]*(?:@[^\\s]+)?"
            },
            "min": 1,
            "max": 32
          }
        },
        "cwd": {
          "within": {
            "root": "project"
          }
        }
      },
      "decision": {
        "loose": "allow",
        "recommended": "ask",
        "strict": "deny"
      },
      "reason": "Adding dependencies downloads packages chosen by name and can run their code.",
      "guidance": {
        "message": "Adding dependencies downloads packages chosen by name and can run their code during install or on first import; the user confirms the package names."
