{
  "schema_version": 1,
  "kind": "pack",
  "id": "canonic/opensearch-elasticsearch",
  "version": "0.1.0",
  "license": "MIT",
  "maintainers": [
    "Canonic"
  ],
  "engines": {
    "shield": ">=0.53.0, <1.0.0"
  },
  "description": "OpenSearch and Elasticsearch clients and administration, with optional local HTTP metadata inspection and review for data, scripts, mutations, security and snapshots.",
  "capabilities": [
    "argument-rules-v1",
    "interleaved-leading-v1",
    "negated-selectors-v1",
    "prefix-leading-v1",
    "regex-v1",
    "requirements-v1",
    "structured-rules-v1",
    "variables-v1"
  ],
  "variables": {
    "local_http": {
      "type": "boolean",
      "default": false,
      "description": "Apply search-service HTTP policy to localhost and 127.0.0.1 on port 9200. Enable only when these addresses serve your search cluster.",
      "setup": {
        "question": "Apply HTTP permissions to your local search cluster on port 9200?"
      }
    }
  },
  "rules": [
    {
      "id": "opensearch-cli-help-0",
      "decision": "allow",
      "reason": "Print built-in help.",
      "conditions": {
        "domain": "argv",
        "executable": {
          "one_of": [
            "opensearch-cli",
            "opensearch-cli.exe",
            "/usr/bin/opensearch-cli",
            "/usr/local/bin/opensearch-cli",
            "/opt/homebrew/bin/opensearch-cli"
          ]
        },
        "arguments": {
          "kind": "exact",
          "values": [
            "--help"
          ]
        }
      }
    },
