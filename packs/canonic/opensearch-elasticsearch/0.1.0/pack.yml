    {
      "id": "local-http-metadata",
      "when": [
        {
          "var": "local_http",
          "equals": true
        }
      ],
      "decision": {
        "loose": "allow",
        "recommended": "allow",
        "strict": "ask"
      },
      "reason": "Inspect metadata from the explicitly selected local search service without following redirects.",
      "conditions": {
        "domain": "web",
        "action": "fetch",
        "url": {
          "schemes": [
            "http",
            "https"
          ],
          "hosts": [
            "localhost",
            "127.0.0.1"
          ],
          "ports": [
            9200
          ],
          "path": {
            "regex": "^/(?:_cluster/health|_cat/(?:health|indices|nodes|shards|count|aliases|plugins))/?$"
          }
        },
        "method": {
          "one_of": [
            "GET",
            "HEAD"
          ]
        }
      },
      "requirements": {
        "request_fields": {
          "/redirects": {
            "exact": "none"
          }
        }
      },
      "on_unmet": {
        "decision": "ask",
        "message": "Establish that this metadata request cannot follow redirects."
      }
    },
    {
      "id": "local-http-security",
      "when": [
        {
          "var": "local_http",
          "equals": true
