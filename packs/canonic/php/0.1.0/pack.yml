            "/usr/local/bin/php",
            "/opt/homebrew/bin/php"
          ]
        },
        "arguments": {
          "kind": "any"
        }
      },
      "decision": {
        "loose": "ask",
        "recommended": "ask",
        "strict": "deny"
      },
      "reason": "Review PHP startup configuration, project code, plugins, dependencies, files, credentials, network access and persistent processes.",
      "fallback": true
