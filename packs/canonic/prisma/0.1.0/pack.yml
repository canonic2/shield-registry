            "/usr/local/bin/prisma",
            "/opt/homebrew/bin/prisma"
          ]
        },
        "arguments": {
          "kind": "prefix",
          "values": [
            "migrate",
            "reset"
          ],
          "leading": {
            "flags": [
              "--help",
              "-h",
              "--version",
              "-v",
              "--json",
              "--experimental",
              "--preview-feature",
              "--early-access",
              "--yes",
              "-y",
              "--no-install",
              "--offline",
              "--silent"
            ],
            "values": [
              "--schema",
              "--config",
              "--url",
              "--telemetry-information",
              "--cwd",
              "--dir",
              "-C",
              "--prefix",
              "--cache"
            ],
            "interleaved": true
          }
        }
      },
      "decision": {
        "loose": "ask",
        "recommended": "deny",
        "strict": "deny"
      },
      "reason": "Review database resets and remote resource deletion."
