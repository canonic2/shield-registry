{
  "schema_version": 1,
  "kind": "pack",
  "id": "canonic/prisma",
  "version": "0.1.0",
  "description": "Prisma ORM and package-runner permissions with review for executable configuration, generation, migrations and destructive database operations.",
  "license": "MIT",
  "maintainers": [
    "Canonic"
  ],
  "engines": {
    "shield": ">=0.53.0, <1.0.0"
  },
  "capabilities": [
    "structured-rules-v1",
    "argument-rules-v1",
    "prefix-leading-v1",
    "interleaved-leading-v1",
    "regex-v1",
    "fallback-rules-v1",
    "unknown-options-v1"
  ],
  "rules": [
    {
      "id": "route-0-review",
      "conditions": {
        "domain": "argv",
        "executable": {
          "one_of": [
            "prisma",
            "/usr/bin/prisma",
            "/usr/local/bin/prisma",
            "/opt/homebrew/bin/prisma"
          ]
        },
        "arguments": {
          "kind": "any"
        }
      },
      "decision": {
        "loose": "ask",
        "recommended": "ask",
        "strict": "deny"
      },
      "reason": "Review executable Prisma configuration, generators, package acquisition, local files, listeners, credentials and database effects.",
      "fallback": true
    },
    {
      "id": "route-0-migrate-reset",
