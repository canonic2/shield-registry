{
  "schema_version": 1,
  "kind": "pack",
  "id": "canonic/sqlite",
  "version": "0.1.0",
  "license": "MIT",
  "maintainers": [
    "Canonic"
  ],
  "engines": {
    "shield": ">=0.53.0, <1.0.0"
  },
  "description": "SQLite shell, database comparison, analysis and synchronization with review for SQL, dot-commands, files, extensions, backups, exports and replication.",
  "capabilities": [
    "argument-rules-v1",
    "structured-rules-v1"
  ],
  "rules": [
    {
      "id": "sqlite3-info-help",
      "conditions": {
        "domain": "argv",
        "executable": {
          "one_of": [
            "sqlite3",
            "/usr/bin/sqlite3",
            "/usr/local/bin/sqlite3",
            "/opt/homebrew/bin/sqlite3",
            "sqlite3.exe"
          ]
        },
        "arguments": {
          "kind": "exact",
          "values": [
            "-help"
          ]
        }
      },
      "decision": "allow",
      "reason": "Print installed version or built-in usage without opening a database."
    },
    {
      "id": "sqlite3-info-long-help",
      "conditions": {
        "domain": "argv",
        "executable": {
          "one_of": [
            "sqlite3",
            "/usr/bin/sqlite3",
            "/usr/local/bin/sqlite3",
            "/opt/homebrew/bin/sqlite3",
            "sqlite3.exe"
          ]
        },
        "arguments": {
          "kind": "exact",
          "values": [
            "--help"
          ]
        }
      },
      "decision": "allow",
      "reason": "Print installed version or built-in usage without opening a database."
    },
    {
      "id": "sqlite3-info-version",
