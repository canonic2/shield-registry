          "one_of": [
            "sqlite3",
            "/usr/bin/sqlite3",
            "/usr/local/bin/sqlite3",
            "/opt/homebrew/bin/sqlite3",
            "sqlite3.exe"
          ]
        },
        "arguments": {
          "kind": "any"
        }
      },
      "decision": {
        "loose": "ask",
        "recommended": "ask",
        "strict": "deny"
      },
      "reason": "Review database paths, startup files, stdin, SQL, dot-commands, extensions and file or process effects."
    },
