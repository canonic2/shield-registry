        "arguments": {
          "kind": "exact",
          "values": [
            "-version"
          ]
        }
      },
      "decision": "allow",
      "reason": "Print installed version or built-in usage without opening a database."
    },
    {
      "id": "sqlite3-info-long-version",
      "conditions": {
        "domain": "argv",
        "executable": {
          "one_of": [
            "sqlite3",
            "/usr/bin/sqlite3",
            "/usr/local/bin/sqlite3",
            "/opt/homebrew/bin/sqlite3",
            "sqlite3.exe"
          ]
        },
        "arguments": {
          "kind": "exact",
          "values": [
            "--version"
          ]
        }
      },
      "decision": "allow",
      "reason": "Print installed version or built-in usage without opening a database."
