{
  "schema_version": 1,
  "kind": "pack",
  "id": "canonic/supabase",
  "version": "0.1.1",
  "description": "Supabase CLI and hosted/local MCP, with reviewed lifecycle, database, deployment, credentials and storage operations.",
  "license": "MIT",
  "maintainers": [
    "Canonic"
  ],
  "engines": {
    "shield": ">=0.54.0, <1.0.0"
  },
  "capabilities": [
    "access-paths-v1",
    "argument-rules-v1",
    "fallback-rules-v1",
    "interleaved-leading-v1",
    "location-v1",
    "mcp-connection-facts-v1",
    "mcp-integrations-v1",
    "negated-selectors-v1",
    "preconditions-v1",
    "prefix-leading-v1",
    "regex-v1",
    "structured-rules-v1",
    "unknown-options-v1",
    "variable-list-branches-v1",
    "variable-parts-v1",
    "variables-v1"
  ],
  "variables": {
    "read_only_sql": {
      "type": "list",
      "layer": "local",
      "max_items": 16,
      "description": "Allow SQL on each listed managed connection. Enter the Shield connection ID, one space, and its exact project-scoped Supabase URL with read_only=true and optional features=database.",
      "items": {
        "type": "string",
        "match": {
          "regex": "^[A-Za-z0-9._-]{1,128} https://mcp\\.supabase\\.com/mcp\\?(?:project_ref=[a-z]{20}&read_only=true|read_only=true&project_ref=[a-z]{20}|project_ref=[a-z]{20}&read_only=true&features=database|project_ref=[a-z]{20}&features=database&read_only=true|read_only=true&project_ref=[a-z]{20}&features=database|read_only=true&features=database&project_ref=[a-z]{20}|features=database&project_ref=[a-z]{20}&read_only=true|features=database&read_only=true&project_ref=[a-z]{20})$"
        }
      }
    }
  },
  "mcp_integrations": {
    "hosted": {
      "transport": "http",
      "fields": {
        "/url": {
          "text": {
            "regex": "^https://mcp\\.supabase\\.com/mcp(?:\\?(?:project_ref=[a-z]{20}|read_only=(?:true|false)|features=[a-z]+(?:(?:,|%2[cC])[a-z]+)*|read_only=(?:true|false)&features=[a-z]+(?:(?:,|%2[cC])[a-z]+)*|features=[a-z]+(?:(?:,|%2[cC])[a-z]+)*&read_only=(?:true|false)|project_ref=[a-z]{20}&read_only=(?:true|false)|read_only=(?:true|false)&project_ref=[a-z]{20}|project_ref=[a-z]{20}&features=[a-z]+(?:(?:,|%2[cC])[a-z]+)*|features=[a-z]+(?:(?:,|%2[cC])[a-z]+)*&project_ref=[a-z]{20}|project_ref=[a-z]{20}&read_only=(?:true|false)&features=[a-z]+(?:(?:,|%2[cC])[a-z]+)*|project_ref=[a-z]{20}&features=[a-z]+(?:(?:,|%2[cC])[a-z]+)*&read_only=(?:true|false)|read_only=(?:true|false)&project_ref=[a-z]{20}&features=[a-z]+(?:(?:,|%2[cC])[a-z]+)*|read_only=(?:true|false)&features=[a-z]+(?:(?:,|%2[cC])[a-z]+)*&project_ref=[a-z]{20}|features=[a-z]+(?:(?:,|%2[cC])[a-z]+)*&project_ref=[a-z]{20}&read_only=(?:true|false)|features=[a-z]+(?:(?:,|%2[cC])[a-z]+)*&read_only=(?:true|false)&project_ref=[a-z]{20}))?$"
          }
        }
      }
    },
    "local": {
      "transport": "http",
      "fields": {
        "/url": {
          "text": {
            "regex": "http://(?:localhost|127\\.0\\.0\\.1):54321/mcp"
          }
        }
      }
    }
  },
  "preconditions": [
    {
      "id": "mcp-read-only-sql-connection",
      "when": [
        {
          "var": "read_only_sql",
          "set": true
        }
      ],
      "conditions": {
        "domain": "mcp",
        "server": "hosted",
        "tool": "execute_sql"
      },
      "requires_any": [
        {
          "connection": {
            "/id": {
              "text": {
                "var": "read_only_sql",
                "split": {
                  "separator": " ",
                  "index": 0
                }
              }
            },
            "/transport/url": {
              "text": {
                "var": "read_only_sql",
                "split": {
                  "separator": " ",
                  "index": 1
                }
              }
            }
          }
        }
      ],
      "on_unmet": {
        "decision": {
          "loose": "ask",
          "recommended": "ask",
          "strict": "deny"
        },
        "message": "Review SQL execution on this connection. Automatic allowance requires a matching reviewed connection ID and read-only URL."
      }
    }
  ],
