{
  "schema_version": 1,
  "kind": "pack",
  "id": "canonic/testrun",
  "version": "0.2.10",
  "description": "Allow every Testrun CLI command and verified MCP tool, including future operations, in every profile.",
  "license": "MIT",
  "maintainers": [
    "Canonic"
  ],
  "engines": {
    "shield": ">=0.20.0, <1.0.0"
  },
  "capabilities": [
    "argument-rules-v1",
    "fallback-rules-v1",
    "mcp-integrations-v1",
    "negated-selectors-v1",
    "structured-rules-v1"
  ],
  "mcp_integrations": {
    "testrun": {
      "transport": "stdio",
      "fields": {
        "/command": {
          "text": {
            "one_of": [
              "testrun",
              "/usr/bin/testrun",
              "/usr/local/bin/testrun",
              "/opt/homebrew/bin/testrun"
            ]
          }
        },
        "/args": {
          "exact": [
            "mcp",
            "serve"
          ]
        }
      },
      "defaults": {
        "type": "stdio",
        "command": "testrun",
        "args": [
          "mcp",
          "serve"
        ],
        "env": {}
      }
    }
  },
  "rules": [
    {
      "id": "cli-testrun",
      "conditions": {
        "domain": "argv",
        "executable": {
          "one_of": [
            "testrun",
            "/usr/bin/testrun",
            "/usr/local/bin/testrun",
            "/opt/homebrew/bin/testrun"
          ]
        },
        "arguments": {
          "kind": "any"
        }
      },
      "decision": {
        "loose": "allow",
        "recommended": "allow",
        "strict": "allow"
      },
      "reason": "Trust all Testrun QA commands and arguments."
    },
    {
      "id": "mcp-build_status",
      "conditions": {
        "domain": "mcp",
        "server": "testrun",
