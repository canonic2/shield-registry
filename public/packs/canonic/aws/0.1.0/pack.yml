{
  "schema_version": 1,
  "kind": "pack",
  "id": "canonic/aws",
  "version": "0.1.0",
  "description": "AWS CLI inspection, data, change, deletion and access classes, with optional required or blocked profiles, allowed regions and a local emulator endpoint.",
  "license": "MIT",
  "maintainers": [
    "Canonic"
  ],
  "engines": {
    "shield": ">=0.10.0, <1.0.0"
  },
  "capabilities": [
    "argument-rules-v1",
    "negated-selectors-v1",
    "option-abbreviations-v1",
    "preconditions-v1",
    "prefix-leading-v1",
    "regex-v1",
    "structured-rules-v1",
    "templates-v1",
    "unknown-options-v1",
    "variables-v1",
    "mcp-integrations-v1",
    "mcp-connection-facts-v1",
    "mcp-effective-fields-v1",
    "fallback-rules-v1"
  ],
  "variables": {
    "profile": {
      "type": "string",
      "description": "Required AWS CLI profile and bound MCP API profile. MCP requires the same single reviewed connector profile; ambient credentials cannot satisfy the gate.",
      "layer": "local",
      "match": {
        "regex": "[A-Za-z0-9][A-Za-z0-9_.@+-]*"
      },
      "max_length": 128,
      "setup": {
        "question": "Require agents to use one AWS profile?",
        "unset": "Any profile",
        "value": "Only this profile",
        "placeholder": "acme-read-only"
      }
    },
    "blocked_profiles": {
      "type": "list",
      "description": "AWS profiles agents must never use. CLI commands must name another profile; bound MCP API calls require a single reviewed connector profile outside this list.",
      "items": {
        "type": "string",
        "match": {
          "regex": "[A-Za-z0-9][A-Za-z0-9_.@+-]*"
        },
        "max_length": 128
      },
      "max_items": 32,
      "setup": {
        "question": "Block specific AWS profiles?",
        "unset": "No blocked profiles",
        "value": "Block these profiles",
        "placeholder": "acme-prod, acme-admin",
        "ask_when": [
          {
            "var": "profile",
            "set": false
          }
        ]
      }
    },
    "regions": {
      "type": "list",
      "description": "Allowed AWS CLI operation regions, required through --region. Bound MCP API calls are blocked because launch metadata cannot prove Python script or task-result regions.",
      "items": {
        "type": "string",
        "match": {
          "regex": "[a-z]{2}(?:-[a-z]+)+-[0-9]+"
        },
        "max_length": 32
      },
      "max_items": 32,
      "setup": {
        "question": "Restrict agents to specific AWS regions?",
        "unset": "Any region",
        "value": "Only these regions",
        "placeholder": "us-east-1, eu-west-1"
      }
    },
    "local_endpoint": {
      "type": "string",
      "description": "Local AWS emulator endpoint, such as LocalStack. Commands with exactly this --endpoint-url skip the profile and region checks and may change the emulator.",
      "match": {
        "regex": "https?://(?:localhost|127\\.0\\.0\\.1|\\[::1\\])(?::[0-9]{1,5})?/?"
      },
      "max_length": 64,
      "setup": {
        "question": "Use a local AWS emulator endpoint?",
        "unset": "No local endpoint",
        "value": "This endpoint",
        "placeholder": "http://localhost:4566"
      }
    }
  },
  "preconditions": [
