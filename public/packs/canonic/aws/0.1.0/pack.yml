        "executable": {
          "one_of": [
            "aws",
            "/bin/aws",
            "/usr/bin/aws",
            "/usr/local/bin/aws",
            "/opt/homebrew/bin/aws"
          ]
        },
        "arguments": {
          "kind": "any"
        }
      },
      "requires_any": [
        {
          "arguments": {
            "kind": "options",
            "prefix": [],
            "flags": [
              "--debug",
              "--no-verify-ssl",
              "--no-paginate",
              "--no-sign-request",
              "--no-cli-pager",
              "--cli-auto-prompt",
              "--no-cli-auto-prompt",
              "--version"
            ],
            "values": [
              "--endpoint-url",
              "--output",
              "--query",
              {
                "name": "--profile",
                "match": {
                  "var": "profile"
                }
              },
              "--region",
              "--color",
              "--ca-bundle",
              "--cli-read-timeout",
              "--cli-connect-timeout",
              "--cli-binary-format"
            ],
            "long_abbreviations": true,
            "operands": true,
            "unknown_options": "skip",
            "require_all": [
              "--profile"
            ]
          }
        },
        {
          "arguments": {
            "kind": "exact",
            "values": [
              "--version"
            ]
          }
        },
        {
          "arguments": {
            "kind": "exact",
            "values": [
              "help"
            ]
          }
        },
        {
          "arguments": {
            "kind": "sequence",
            "prefix": [
              {
                "regex": "[a-z0-9][a-z0-9-]*"
              },
              "help"
            ],
            "rest": {
              "kind": "none"
            }
          }
        },
        {
          "arguments": {
            "kind": "sequence",
            "prefix": [
              {
                "regex": "[a-z0-9][a-z0-9-]*"
