              "aws___list_regions",
              "aws___get_regional_availability"
            ]
          }
        }
      },
      "requires_any": [
        {
          "connection": {
            "/transport/env/AWS_MCP_PROXY_PROFILES": {
              "text": {
                "regex": "[A-Za-z0-9][A-Za-z0-9_.@+-]*"
              }
            }
          }
        }
      ],
      "on_unmet": {
        "decision": "deny",
        "message": "A blocked-profile restriction requires one explicit reviewed connector profile; ambient or multi-profile connections are unsupported."
      }
    },
    {
      "id": "mcp-blocked-profiles",
      "when": [
        {
          "var": "blocked_profiles",
          "set": true
        }
      ],
      "conditions": {
        "domain": "mcp",
        "server": {
          "one_of": [
            "hosted",
            "hosted-profile"
          ]
        },
        "tool": {
          "not": {
            "one_of": [
              "aws___retrieve_skill",
              "aws___search_documentation",
              "aws___read_documentation",
              "aws___list_regions",
              "aws___get_regional_availability"
            ]
          }
        }
      },
      "requires_any": [
        {
          "connection": {
            "/effective/profile": {
              "text": {
                "not": {
                  "var": "blocked_profiles"
                }
              }
            },
            "/transport/env/AWS_MCP_PROXY_PROFILES": {
              "text": {
                "not": {
                  "var": "blocked_profiles"
                }
              }
            }
          }
        }
      ],
      "on_unmet": {
        "decision": "deny",
        "message": "AWS MCP API calls must explicitly name a profile outside the blocked list."
      }
    },
    {
      "id": "mcp-operation-region",
      "when": [
        {
          "var": "regions",
          "set": true
        }
      ],
      "conditions": {
        "domain": "mcp",
        "server": {
          "one_of": [
            "hosted",
            "hosted-profile"
          ]
        },
        "tool": {
          "not": {
            "one_of": [
              "aws___retrieve_skill",
              "aws___search_documentation",
              "aws___read_documentation",
              "aws___list_regions",
              "aws___get_regional_availability"
            ]
          }
        }
      },
      "requires_any": [
        {
          "connection": {
            "/verified/operation_region": {
              "text": {
                "var": "regions"
              }
            }
          }
        }
      ],
      "on_unmet": {
        "decision": "deny",
        "message": "AWS MCP API calls are blocked: launch region metadata cannot establish the regions used by Python scripts or task results."
      }
    }
