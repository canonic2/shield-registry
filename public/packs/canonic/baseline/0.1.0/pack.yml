{
  "schema_version": 1,
  "kind": "pack",
  "id": "canonic/baseline",
  "version": "0.1.0",
  "description": "Standard command and file permissions with approved read/write paths and conservative review of unmodeled effects.",
  "license": "MIT",
  "maintainers": [
    "Canonic"
  ],
  "engine": ">=0.1.0, <0.2.0",
  "capabilities": [
    "access-paths-v1",
    "argument-rules-v1",
    "location-v1",
    "regex-v1",
    "requirements-v1",
    "structured-rules-v1"
  ],
