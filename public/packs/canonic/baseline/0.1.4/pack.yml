        "arguments": {
          "kind": "options",
          "prefix": [],
          "flags": [
            "-a",
            "-m",
            "-n",
            "-p",
            "-r",
            "-s",
            "-v"
          ],
          "values": [],
          "operands": false
        }
      },
      "decision": {
        "loose": "allow",
        "recommended": "allow",
        "strict": "allow"
