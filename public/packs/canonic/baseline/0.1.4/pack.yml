      "conditions": {
        "domain": "argv",
        "executable": {
          "one_of": [
            "sleep",
            "/bin/sleep",
            "/usr/bin/sleep"
          ]
        },
        "arguments": {
          "kind": "sequence",
          "prefix": [],
          "rest": {
            "kind": "each",
            "match": {
              "regex": "[0-9]+(?:\\.[0-9]+)?"
            },
            "min": 1,
            "max": 1
          }
        }
      },
      "decision": {
        "loose": "allow",
        "recommended": "allow",
        "strict": "allow"
      }
    },
    {
      "id": "stdin-cat",
      "conditions": {
        "domain": "argv",
        "executable": {
          "one_of": [
            "cat",
            "/bin/cat",
            "/usr/bin/cat"
          ]
        },
        "arguments": {
          "kind": "options",
          "prefix": [],
          "flags": [
            "-b",
            "-e",
            "-n",
            "-s",
            "-t",
            "-u",
            "-v",
            "-E",
            "-T"
          ],
          "values": [],
          "operands": false
        }
      },
      "decision": {
        "loose": "allow",
        "recommended": "allow",
        "strict": "allow"
      }
