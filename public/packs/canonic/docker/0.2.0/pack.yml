      "id": "version-flag",
      "conditions": {
        "domain": "argv",
        "executable": {
          "one_of": [
            "docker",
            "/usr/bin/docker",
            "/usr/local/bin/docker",
            "/opt/homebrew/bin/docker",
            "/Applications/Docker.app/Contents/Resources/bin/docker"
          ]
        },
        "arguments": {
          "kind": "exact",
          "values": [
            "--version"
          ]
        }
      },
      "decision": {
        "loose": "allow",
        "recommended": "allow",
        "strict": "allow"
      },
      "reason": "Print the version or built-in help."
    },
    {
      "id": "version-short",
