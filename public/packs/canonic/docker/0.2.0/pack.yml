{
  "schema_version": 1,
  "kind": "pack",
  "id": "canonic/docker",
  "version": "0.2.0",
  "license": "MIT",
  "maintainers": [
    "Canonic"
  ],
  "description": "Docker containers, images, builds and Compose, reviewing host mounts, privileged runtimes, the daemon socket, build secrets, registry publication, credentials and data removal.",
  "engines": {
    "shield": ">=0.57.0, <1.0.0"
  },
  "capabilities": [
    "access-paths-v1",
    "argument-paths-v1",
    "argument-rules-v1",
    "docker-context-exec-trust-v1",
    "location-v1",
    "negated-selectors-v1",
    "prefix-leading-v1",
    "regex-v1",
    "requirements-v1",
    "structured-rules-v1",
    "variables-v1"
  ],
  "variables": {
    "docker_contexts": {
      "type": "list",
      "description": "Docker contexts agents may select with --context, such as the context a workspace manager pins.",
      "items": {
        "type": "string",
        "match": {
          "regex": "^[A-Za-z0-9][A-Za-z0-9_.+-]*$"
        },
        "max_length": 128
      },
      "max_items": 16,
      "setup": {
        "question": "Allow agents to select specific Docker contexts with --context?",
        "unset": "No context selection",
        "value": "These contexts",
        "placeholder": "desktop-linux"
      }
    },
    "docker_trusted_exec_contexts": {
      "type": "list",
      "description": "Trust programs and their descendants in every container, present or future, on the selected Docker daemons. Only contexts also listed in docker_contexts take effect.",
      "items": {
        "type": "string",
        "match": {
          "regex": "^[A-Za-z0-9][A-Za-z0-9_.+-]*$"
        },
        "max_length": 128
      },
      "max_items": 16,
      "setup": {
        "question": "Which selected Docker contexts may run trusted commands in every container?",
        "unset": "Review unrecognized container commands",
        "value": "Trust exec in these contexts",
        "placeholder": "desktop-linux"
      }
    }
  },
  "rules": [
