        "domain": "argv",
        "executable": {
          "one_of": [
            "gate",
            "/usr/bin/gate",
            "/usr/local/bin/gate",
            "/opt/homebrew/bin/gate"
          ]
        },
        "arguments": {
          "kind": "exact",
          "values": [
            "--version"
          ]
        }
      },
      "decision": {
        "loose": "allow",
        "recommended": "allow",
        "strict": "allow"
      },
      "reason": "Print the version or built-in help."
