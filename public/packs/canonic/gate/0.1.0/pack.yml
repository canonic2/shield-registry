{
  "schema_version": 1,
  "kind": "pack",
  "id": "canonic/gate",
  "version": "0.1.0",
  "description": "Gate repository inspection, staging, commits and worktrees, with separate decisions for remotes, history rewrites, branch deletion and workspace policy acceptance.",
  "license": "MIT",
  "maintainers": [
    "Canonic"
  ],
  "engines": {
    "shield": ">=0.18.0, <1.0.0"
  },
  "capabilities": [
    "access-paths-v1",
    "argument-paths-v1",
    "argument-rules-v1",
    "fallback-rules-v1",
    "interleaved-leading-v1",
    "location-v1",
    "mcp-integrations-v1",
    "negated-selectors-v1",
    "prefix-leading-v1",
    "regex-v1",
    "requirements-v1",
    "structured-rules-v1",
    "unknown-options-v1"
  ],
  "mcp_integrations": {
    "gate": {
      "transport": "stdio",
      "fields": {
        "/command": {
          "text": {
            "regex": "gate|/usr/bin/gate|/usr/local/bin/gate|/opt/homebrew/bin/gate|/(?:Users|home)/[A-Za-z0-9_][A-Za-z0-9_.-]*/\\.local/bin/gate"
          }
        },
        "/args/0": {
          "exact": "mcp"
        },
        "/args/1": {
          "exact": "serve"
        }
      },
      "defaults": {
        "type": "stdio",
        "command": "gate",
        "args": [
          "mcp",
          "serve"
        ],
        "env": {}
      }
    }
  },
  "rules": [
