{
  "schema_version": 1,
  "kind": "pack",
  "id": "canonic/gate",
  "version": "0.2.4",
  "description": "Gate repository workflows and automatic workspace storage conversion, with explicit remote, data-loss and ownership boundaries.",
  "license": "MIT",
  "maintainers": [
    "Canonic"
  ],
  "engines": {
    "shield": ">=0.20.0, <1.0.0"
  },
  "capabilities": [
    "access-paths-v1",
    "argument-paths-v1",
    "argument-rules-v1",
    "fallback-rules-v1",
    "interleaved-leading-v1",
    "location-v1",
    "mcp-integrations-v1",
    "negated-selectors-v1",
    "prefix-leading-v1",
    "regex-v1",
    "requirements-v1",
    "structured-rules-v1",
    "unknown-options-v1",
    "field-paths-v1"
  ],
  "mcp_integrations": {
    "gate": {
      "transport": "stdio",
      "fields": {
        "/command": {
          "text": {
            "regex": "gate|/usr/bin/gate|/usr/local/bin/gate|/opt/homebrew/bin/gate|/(?:Users|home)/[A-Za-z0-9_][A-Za-z0-9_.-]*/\\.local/bin/gate"
          }
        },
        "/args": {
          "exact": [
            "mcp",
            "serve"
          ]
        }
      },
      "defaults": {
        "type": "stdio",
        "command": "gate",
        "args": [
          "mcp",
          "serve"
        ],
        "env": {}
      }
    }
  },
