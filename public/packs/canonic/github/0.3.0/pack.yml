{
  "schema_version": 1,
  "kind": "pack",
  "id": "canonic/github",
  "version": "0.3.0",
  "description": "GitHub CLI and official MCP permissions. Optional repository setting restricts both to one explicit OWNER/REPO; omitted means no repository restriction.",
  "license": "MIT",
  "maintainers": [
    "Canonic"
  ],
  "engines": {
    "shield": ">=0.20.0, <1.0.0"
  },
  "capabilities": [
    "structured-rules-v1",
    "argument-rules-v1",
    "prefix-leading-v1",
    "interleaved-leading-v1",
    "regex-v1",
    "negated-selectors-v1",
    "unknown-options-v1",
    "preconditions-v1",
    "glob-v1",
    "fallback-rules-v1",
    "mcp-integrations-v1",
    "variables-v1",
    "variable-parts-v1"
  ],
  "mcp_integrations": {
    "hosted": {
      "transport": "http",
      "fields": {
        "/url": {
          "exact": "https://api.githubcopilot.com/mcp/"
        }
      },
      "defaults": {
        "type": "http",
        "url": "https://api.githubcopilot.com/mcp/"
      }
    },
    "local": {
      "transport": "stdio",
      "fields": {
        "/command": {
          "text": {
            "one_of": [
              "github-mcp-server",
              "/usr/bin/github-mcp-server",
              "/usr/local/bin/github-mcp-server",
              "/opt/homebrew/bin/github-mcp-server"
            ]
          }
        },
        "/args": {
          "exact": [
            "stdio"
          ]
        }
      },
      "defaults": {
        "type": "stdio",
        "command": "github-mcp-server",
        "args": [
          "stdio"
        ],
        "env": {}
      }
    },
    "local-read-only": {
      "transport": "stdio",
      "fields": {
        "/command": {
          "text": {
            "one_of": [
              "github-mcp-server",
              "/usr/bin/github-mcp-server",
              "/usr/local/bin/github-mcp-server",
              "/opt/homebrew/bin/github-mcp-server"
            ]
          }
        },
        "/args": {
          "exact": [
            "stdio",
            "--read-only"
          ]
        }
      },
      "defaults": {
        "type": "stdio",
        "command": "github-mcp-server",
        "args": [
          "stdio",
          "--read-only"
        ],
        "env": {}
      }
    }
  },
