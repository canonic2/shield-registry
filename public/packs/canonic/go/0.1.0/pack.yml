{
  "schema_version": 1,
  "kind": "pack",
  "id": "canonic/go",
  "version": "0.1.0",
  "license": "MIT",
  "maintainers": [
    "Canonic"
  ],
  "description": "Go toolchain, formatting, linting, vulnerability scans, test runners and coverage, with checked gofmt paths and review for execution, acquisition, configuration and generated files.",
  "engines": {
    "shield": ">=0.53.0, <1.0.0"
  },
  "capabilities": [
    "structured-rules-v1",
    "argument-rules-v1",
    "argument-paths-v1",
    "location-v1",
    "access-paths-v1",
    "requirements-v1",
    "regex-v1",
    "fallback-rules-v1",
    "unknown-options-v1",
    "directory-options-v1"
  ],
  "directory_options": [
    {
      "executable": {
        "one_of": [
          "go",
          "/usr/bin/go",
          "/usr/local/bin/go",
          "/opt/homebrew/bin/go",
          "/usr/local/go/bin/go",
          "/usr/lib/go/bin/go",
          "/usr/lib/golang/bin/go"
        ]
      },
      "option": "-C",
      "forms": [
        "separate",
        "equals"
      ],
      "paths": "follow"
    }
  ],
