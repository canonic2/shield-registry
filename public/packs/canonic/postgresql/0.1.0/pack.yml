            "/usr/bin/pg_restore",
            "/usr/local/bin/pg_restore",
            "/opt/homebrew/bin/pg_restore"
          ]
        },
        "arguments": {
          "kind": "risk_tokens",
          "prefix": [],
          "any_of": [
            "--clean",
            {
              "regex": "--clean=.*"
            },
            {
              "regex": "-[A-Za-z]*c[A-Za-z]*"
            }
          ]
        }
      },
      "decision": {
        "loose": "ask",
        "recommended": "deny",
        "strict": "deny"
