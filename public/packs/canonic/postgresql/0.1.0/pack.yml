        "domain": "argv",
        "executable": {
          "one_of": [
            "psql",
            "/usr/bin/psql",
            "/usr/local/bin/psql",
            "/opt/homebrew/bin/psql"
          ]
        },
        "arguments": {
          "kind": "exact",
          "values": [
            "--version"
          ]
        }
      },
      "decision": "allow",
      "reason": "Print version or built-in help from the trusted installation."
