{
  "schema_version": 1,
  "kind": "pack",
  "id": "canonic/python",
  "version": "0.1.0",
  "license": "MIT",
  "maintainers": [
    "Canonic"
  ],
  "description": "Python ecosystem permissions: interpreters, package/environment managers, Ruff/Black, type checking, tests, coverage, hooks/watchers and security auditing, with checked paths and reviewed execution, global changes and publication.",
  "engines": {
    "shield": ">=0.53.0, <1.0.0"
  },
  "capabilities": [
    "structured-rules-v1",
    "argument-rules-v1",
    "argument-paths-v1",
    "location-v1",
    "access-paths-v1",
    "requirements-v1",
    "regex-v1",
    "fallback-rules-v1",
    "unknown-options-v1",
    "negated-selectors-v1"
  ],
  "rules": [
    {
      "id": "python-version-version",
      "conditions": {
        "domain": "argv",
        "executable": {
          "one_of": [
            "python",
            "/usr/bin/python",
            "/usr/local/bin/python",
            "/opt/homebrew/bin/python"
          ]
        },
        "arguments": {
          "kind": "exact",
          "values": [
            "--version"
          ]
        }
      },
      "decision": "allow",
      "reason": "Print the installed tool version using its trusted installation."
    },
