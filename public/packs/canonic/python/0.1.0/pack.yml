    {
      "id": "isolated-venv",
      "conditions": {
        "domain": "argv",
        "executable": {
          "one_of": [
            "python",
            "/usr/bin/python",
            "/usr/local/bin/python",
            "/opt/homebrew/bin/python",
            "python3",
            "/usr/bin/python3",
            "/usr/local/bin/python3",
            "/opt/homebrew/bin/python3"
          ]
        },
        "arguments": {
          "kind": "options",
          "prefix": [
            "-I",
            "-S",
            "-m",
            "venv"
          ],
          "flags": [
            "--system-site-packages",
            "--symlinks",
            "--copies",
            "--upgrade",
            "--without-pip",
            "--without-scm-ignore-files"
          ],
          "values": [
            "--prompt"
          ],
          "operands": {
            "match": {
              "regex": "[^\\x00\\r\\n]+"
            },
            "min": 1,
            "max": 32
          }
        },
        "cwd": {
          "within": {
            "root": "write"
          }
        }
      },
      "decision": {
        "loose": "allow",
        "recommended": "allow",
        "strict": "ask"
      },
      "reason": "Create virtual environments at approved destinations using the isolated standard library.",
      "requirements": {
        "argument_paths": {
          "grammar": {
            "kind": "options",
            "prefix": [
              "-I",
              "-S",
              "-m",
              "venv"
            ],
            "flags": [
              "--system-site-packages",
              "--symlinks",
              "--copies",
              "--upgrade",
              "--without-pip",
              "--without-scm-ignore-files"
            ],
            "values": [
              "--prompt"
            ],
            "operands": {
              "match": {
                "regex": "[^\\x00\\r\\n]+"
              },
              "min": 1,
              "max": 32
            }
          },
          "operands": {
            "path": {
              "within": {
                "root": "write"
              },
              "exclude": [
                {
                  "root": "project",
                  "path": ".git"
                },
                {
                  "root": "project",
                  "path": ".shield"
                },
                {
                  "root": "project",
                  "path": ".ssh"
                },
                {
                  "root": "project",
                  "path": ".aws"
                },
                {
                  "root": "project",
                  "path": ".codex"
                },
                {
                  "root": "project",
                  "path": ".claude"
                },
                {
                  "root": "project",
                  "path": ".env"
                },
                {
                  "root": "project",
                  "path": ".mcp.json"
                }
              ]
            },
            "recursive": true
          }
        }
      },
      "on_unmet": {
        "decision": "deny",
        "message": "Create virtual environments inside approved writable folders away from protected state."
      }
    },
    {
      "id": "python-execution",
      "conditions": {
        "domain": "argv",
        "executable": {
          "one_of": [
            "python",
            "/usr/bin/python",
            "/usr/local/bin/python",
            "/opt/homebrew/bin/python",
            "python3",
            "/usr/bin/python3",
            "/usr/local/bin/python3",
            "/opt/homebrew/bin/python3"
          ]
        },
        "arguments": {
          "kind": "any"
        }
      },
      "decision": {
        "loose": "ask",
        "recommended": "ask",
        "strict": "deny"
      },
      "reason": "Python scripts, modules, inline code, stdin and interactive sessions execute code and require review.",
      "fallback": true
    },
