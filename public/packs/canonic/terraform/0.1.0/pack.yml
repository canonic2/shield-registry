{
  "schema_version": 1,
  "kind": "pack",
  "id": "canonic/terraform",
  "version": "0.1.0",
  "description": "Terraform CLI formatting with checked paths, and reviewed provider, state and infrastructure operations.",
  "license": "MIT",
  "maintainers": [
    "Canonic"
  ],
  "engines": {
    "shield": ">=0.53.0, <1.0.0"
  },
  "capabilities": [
    "access-paths-v1",
    "argument-paths-v1",
    "argument-rules-v1",
    "location-v1",
    "directory-options-v1",
    "fallback-rules-v1",
    "negated-selectors-v1",
    "regex-v1",
    "requirements-v1",
    "structured-rules-v1",
    "unknown-options-v1"
  ],
  "directory_options": [
    {
      "executable": {
        "one_of": [
          "terraform",
          "/usr/bin/terraform",
          "/usr/local/bin/terraform",
          "/opt/homebrew/bin/terraform"
        ]
      },
      "option": "-chdir",
      "forms": [
        "equals"
      ],
      "paths": "follow"
    }
  ],
  "rules": [
    {
      "id": "help-empty",
      "conditions": {
        "domain": "argv",
        "executable": {
          "one_of": [
            "terraform",
            "/usr/bin/terraform",
            "/usr/local/bin/terraform",
            "/opt/homebrew/bin/terraform"
          ]
        },
        "arguments": {
          "kind": "exact",
          "values": []
        }
      },
      "decision": "allow",
      "reason": "Print built-in help without running the operation."
    },
    {
      "id": "help--help",
      "conditions": {
        "domain": "argv",
        "executable": {
          "one_of": [
            "terraform",
            "/usr/bin/terraform",
            "/usr/local/bin/terraform",
            "/opt/homebrew/bin/terraform"
          ]
        },
        "arguments": {
          "kind": "exact",
          "values": [
            "-help"
          ]
        }
      },
      "decision": "allow",
      "reason": "Print built-in help without running the operation."
    },
