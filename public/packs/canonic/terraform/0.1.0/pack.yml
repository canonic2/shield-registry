            "-h"
          ]
        }
      },
      "decision": "allow",
      "reason": "Print built-in help without running the operation."
    },
    {
      "id": "help--version",
      "conditions": {
        "domain": "argv",
        "executable": {
          "one_of": [
            "terraform",
            "/usr/bin/terraform",
            "/usr/local/bin/terraform",
