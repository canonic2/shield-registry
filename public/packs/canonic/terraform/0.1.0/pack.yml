          ]
        }
      },
      "decision": "allow",
      "reason": "Print built-in help without running the operation."
    },
    {
      "id": "help---version",
      "conditions": {
        "domain": "argv",
        "executable": {
          "one_of": [
            "terraform",
            "/usr/bin/terraform",
            "/usr/local/bin/terraform",
            "/opt/homebrew/bin/terraform"
          ]
        },
        "arguments": {
          "kind": "exact",
          "values": [
            "--version"
          ]
        }
      },
      "decision": "allow",
      "reason": "Print built-in help without running the operation."
    },
    {
      "id": "help--v",
      "conditions": {
        "domain": "argv",
        "executable": {
          "one_of": [
            "terraform",
            "/usr/bin/terraform",
            "/usr/local/bin/terraform",
            "/opt/homebrew/bin/terraform"
          ]
        },
        "arguments": {
          "kind": "exact",
          "values": [
            "-v"
          ]
        }
      },
      "decision": "allow",
      "reason": "Print built-in help without running the operation."
    },
    {
      "id": "version",
      "conditions": {
        "domain": "argv",
        "executable": {
          "one_of": [
            "terraform",
            "/usr/bin/terraform",
            "/usr/local/bin/terraform",
            "/opt/homebrew/bin/terraform"
          ]
        },
        "arguments": {
          "kind": "sequence",
          "prefix": [
            "version"
          ],
          "rest": {
            "kind": "each",
            "match": {
              "regex": "^-[^\\s]+$"
            }
          }
        }
      },
      "decision": "allow",
      "reason": "Print the installed CLI version."
    },
    {
      "id": "fmt",
      "conditions": {
        "domain": "argv",
        "executable": {
          "one_of": [
            "terraform",
            "/usr/bin/terraform",
            "/usr/local/bin/terraform",
            "/opt/homebrew/bin/terraform"
          ]
        },
        "arguments": {
          "kind": "options",
          "prefix": [
            "fmt"
          ],
          "flags": [],
          "values": [],
          "operands": true,
          "unknown_options": "skip"
        },
        "cwd": {
          "within": {
            "root": "write"
          },
          "exclude": [
            {
              "root": "project",
              "path": ".git"
            },
            {
              "root": "project",
              "path": ".shield"
            },
            {
              "root": "project",
              "path": ".aws"
            },
            {
              "root": "project",
              "path": ".ssh"
            },
            {
              "root": "project",
              "path": ".env"
            },
            {
              "root": "project",
              "path": ".mcp.json"
            },
            {
              "root": "project",
              "path": ".codex"
            },
            {
              "root": "project",
              "path": ".claude"
            },
            {
              "root": "project",
              "path": ".terraform.d"
            }
          ]
        }
      },
      "decision": {
        "loose": "allow",
        "recommended": "allow",
        "strict": "ask"
      },
      "reason": "Format configuration files inside approved writable folders.",
      "requirements": {
        "argument_paths": {
          "grammar": {
            "kind": "options",
            "prefix": [
              "fmt"
            ],
            "flags": [],
            "values": [],
            "operands": true,
            "unknown_options": "skip"
          },
          "operands": {
            "path": {
              "within": {
                "root": "write"
              },
              "exclude": [
                {
                  "root": "project",
                  "path": ".git"
                },
                {
                  "root": "project",
                  "path": ".shield"
                },
                {
                  "root": "project",
                  "path": ".aws"
                },
                {
                  "root": "project",
                  "path": ".ssh"
                },
                {
                  "root": "project",
                  "path": ".env"
                },
                {
                  "root": "project",
                  "path": ".mcp.json"
                },
                {
                  "root": "project",
                  "path": ".codex"
                },
                {
                  "root": "project",
                  "path": ".claude"
                },
                {
                  "root": "project",
                  "path": ".terraform.d"
                }
              ]
            },
            "recursive": true
          }
        }
      },
      "on_unmet": {
        "decision": "ask",
        "message": "Review formatting paths outside approved folders, protected paths, stdin or unparseable arguments."
      }
    },
