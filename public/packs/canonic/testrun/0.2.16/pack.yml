{
  "schema_version": 1,
  "kind": "pack",
  "id": "canonic/testrun",
  "version": "0.2.16",
  "description": "Allow every Testrun CLI command and verified MCP tool, including future operations, with caller-named host files kept inside approved roots.",
  "license": "MIT",
  "maintainers": [
    "Canonic"
  ],
  "engines": {
    "shield": ">=0.52.0, <1.0.0"
  },
  "capabilities": [
    "access-paths-v1",
    "argument-paths-v1",
    "argument-rules-v1",
    "fallback-rules-v1",
    "field-negation-v1",
    "field-path-arrays-v1",
    "field-paths-v1",
    "interleaved-leading-v1",
    "location-v1",
    "mcp-integrations-v1",
    "negated-selectors-v1",
    "regex-v1",
    "requirements-v1",
    "structured-rules-v1",
    "unknown-options-v1",
    "variables-v1"
  ],
  "variables": {
    "windows_executable": {
      "type": "string",
      "layer": "local",
      "max_length": 1024,
      "match": {
        "regex": "(?i)[a-z]:[\\\\/](?:[^\\x00\\r\\n:]+[\\\\/])?testrun\\.exe"
      },
      "description": "The exact absolute path to the installed Windows Testrun CLI.",
      "setup": {
        "question": "Use an absolute Windows Testrun executable path?",
        "unset": "Standard command spellings"
      }
    }
  },
  "mcp_integrations": {
    "testrun": {
      "transport": "stdio",
      "fields": {
        "/command": {
          "text": {
            "regex": "^(?:testrun|/usr/bin/testrun|/usr/local/bin/testrun|/opt/homebrew/bin/testrun|testrun\\.exe|/(?:Users|home)/[A-Za-z0-9_][A-Za-z0-9_.-]*/\\.local/bin/testrun)$"
          }
        },
        "/args": {
          "exact": [
            "mcp",
            "serve"
          ]
        }
      },
      "defaults": {
        "type": "stdio",
        "command": "testrun",
        "args": [
          "mcp",
          "serve"
        ],
        "env": {}
      }
    }
  },
  "rules": [
    {
      "id": "cli-testrun",
      "conditions": {
        "domain": "argv",
        "executable": {
          "one_of": [
            "testrun",
            "/usr/bin/testrun",
            "/usr/local/bin/testrun",
            "/opt/homebrew/bin/testrun",
            "testrun.exe"
          ]
        },
        "arguments": {
          "kind": "any"
        }
      },
      "decision": {
        "loose": "allow",
        "recommended": "allow",
        "strict": "allow"
      },
      "reason": "Allow Testrun QA commands; host-file arguments have their own checks."
    },
    {
      "id": "cli-json-host-path",
      "conditions": {
        "domain": "argv",
        "executable": {
          "one_of": [
            "testrun",
            "/usr/bin/testrun",
            "/usr/local/bin/testrun",
            "/opt/homebrew/bin/testrun",
            "testrun.exe"
          ]
        },
        "arguments": {
          "kind": "risk_tokens",
          "prefix": [],
          "any_of": [
            {
              "regex": "(?s).*\"(filePath|resourcesDir|storageState|certPath|keyPath|pfxPath|reportDirectory|endpointFile|configFile|toolPath|project)\"\\s*:\\s*\".*"
            },
            {
              "regex": "(?s).*(?:(?:\"(?:operation|action)\"\\s*:\\s*\"(?:storage_register|har_register|heap_import|page_add_script_tag|page_add_style_tag|har_capture_start|callback_resolve|storage_export|http_context_storage_state|context_create)\"|\"kind\"\\s*:\\s*\"(?:import|native_trace|file_path)\"|\"(?:artifact|recordHar)\"\\s*:\\s*\\{).*\"path\"\\s*:\\s*\"|\"path\"\\s*:\\s*\".*(?:\"(?:operation|action)\"\\s*:\\s*\"(?:storage_register|har_register|heap_import|page_add_script_tag|page_add_style_tag|har_capture_start|callback_resolve|storage_export|http_context_storage_state|context_create)\"|\"kind\"\\s*:\\s*\"(?:import|native_trace|file_path)\"|\"(?:artifact|recordHar)\"\\s*:\\s*\\{)).*"
            },
            {
              "regex": "(?s).*(?:\"artifact\"\\s*:\\s*\\{.*\"glob\"\\s*:\\s*\"|\"xcode\"\\s*:\\s*\\{.*\"workspace\"\\s*:\\s*\").*"
            },
            {
              "regex": "(?s).*\"sourceFiles\"\\s*:\\s*\\[\\s*\".*"
            },
            {
              "regex": "(?s).*\\\\u.*"
            },
            {
              "regex": "(?s).*\"outputPath\"\\s*:\\s*\".*"
            }
          ]
        }
      },
      "decision": {
        "loose": "ask",
        "recommended": "ask",
        "strict": "ask"
      },
      "reason": "A JSON argument names a host file that Shield cannot check; review it, or use the MCP tool."
    },
    {
      "id": "cli-app-install-path",
      "conditions": {
        "domain": "argv",
        "executable": {
