      "decision": {
        "loose": "allow",
        "recommended": "allow",
        "strict": "allow"
      },
      "requirements": {
        "argument_paths": {
          "grammar": {
            "kind": "options",
            "prefix": [
              "app",
              "install"
            ],
            "leading": {
              "flags": [
                "--json"
              ],
              "values": [
                "--target"
              ],
              "interleaved": true
            },
            "flags": [
              "--json",
              "--replace"
            ],
            "values": [
              "--target",
              "--artifact-ref",
              "--play-protect"
            ],
            "operands": true,
            "unknown_options": "skip"
          },
          "operands": {
            "path": {
              "within": {
                "root": "read"
              }
            }
          }
        }
      },
      "on_unmet": {
        "decision": "ask",
        "message": "Name a host file inside the approved read roots."
      },
      "reason": "Testrun reads or writes the host files these arguments name; keep them inside the approved roots."
