      "id": "version",
      "conditions": {
        "domain": "argv",
        "executable": {
          "one_of": [
            "testrun",
            "/usr/bin/testrun",
            "/usr/local/bin/testrun",
            "/opt/homebrew/bin/testrun"
          ]
        },
        "arguments": {
          "kind": "exact",
          "values": [
            "--version"
          ]
        }
      },
      "decision": {
        "loose": "allow",
        "recommended": "allow",
        "strict": "allow"
      },
      "reason": "Print the version or built-in help."
