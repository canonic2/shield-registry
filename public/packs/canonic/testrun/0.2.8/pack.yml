{
  "schema_version": 1,
  "kind": "pack",
  "id": "canonic/testrun",
  "version": "0.2.8",
  "description": "Testrun device and isolated-browser inspection and input, with separate decisions for builds that run custom commands, app removal, host file transfer and agent setup.",
  "license": "MIT",
  "maintainers": [
    "Canonic"
  ],
  "engines": {
    "shield": ">=0.20.0, <1.0.0"
  },
  "capabilities": [
    "access-paths-v1",
    "argument-paths-v1",
    "argument-rules-v1",
    "fallback-rules-v1",
    "field-negation-v1",
    "field-paths-v1",
    "interleaved-leading-v1",
    "location-v1",
    "mcp-integrations-v1",
    "negated-selectors-v1",
    "prefix-leading-v1",
    "regex-v1",
    "requirements-v1",
    "structured-rules-v1",
    "unknown-options-v1"
  ],
  "mcp_integrations": {
    "testrun": {
      "transport": "stdio",
      "fields": {
        "/command": {
          "text": {
            "one_of": [
              "testrun",
              "/usr/bin/testrun",
              "/usr/local/bin/testrun",
              "/opt/homebrew/bin/testrun"
            ]
          }
        },
        "/args": {
          "exact": [
            "mcp",
            "serve"
          ]
        }
      },
      "defaults": {
        "type": "stdio",
        "command": "testrun",
        "args": [
          "mcp",
          "serve"
        ],
        "env": {}
      }
    }
  },
  "rules": [
    {
      "id": "version",
      "conditions": {
        "domain": "argv",
        "executable": {
          "one_of": [
            "testrun",
            "/usr/bin/testrun",
            "/usr/local/bin/testrun",
            "/opt/homebrew/bin/testrun"
          ]
        },
        "arguments": {
          "kind": "exact",
          "values": [
            "--version"
          ]
        }
      },
      "decision": {
        "loose": "allow",
        "recommended": "allow",
        "strict": "allow"
      },
      "reason": "Print the version or built-in help."
    },
