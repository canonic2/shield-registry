{
  "schema_version": 1,
  "kind": "pack",
  "id": "canonic/workbench",
  "version": "0.3.0",
  "description": "Allow Workbench MCP on a verified connection, with Shield-approved locations for image inputs and saved outputs.",
  "license": "MIT",
  "maintainers": [
    "Canonic"
  ],
  "engines": {
    "shield": ">=0.55.0, <1.0.0"
  },
  "capabilities": [
    "access-paths-v1",
    "fallback-rules-v1",
    "field-negation-v1",
    "field-path-arrays-v1",
    "field-paths-v1",
    "location-v1",
    "mcp-integrations-v1",
    "negated-selectors-v1",
    "regex-v1",
    "requirements-v1",
    "structured-rules-v1"
  ],
  "mcp_integrations": {
    "workbench": {
      "transport": "stdio",
      "fields": {
        "/command": {
          "text": {
            "regex": "^(?:workbench(?:\\.cmd)?|/usr/bin/workbench|/usr/local/bin/workbench|/opt/homebrew/bin/workbench|/(?:Users|home)/[A-Za-z0-9_][A-Za-z0-9_. -]*/\\.local/bin/workbench|[A-Za-z]:[\\\\/]Users[\\\\/][A-Za-z0-9_][A-Za-z0-9_. -]*[\\\\/]\\.local[\\\\/]bin[\\\\/]workbench\\.cmd)$"
          }
        },
        "/args": {
          "exact": [
            "mcp",
            "serve"
          ]
        }
      },
      "defaults": {
        "type": "stdio",
        "command": "workbench",
        "args": [
          "mcp",
          "serve"
        ],
        "env": {}
      }
    }
  },
  "rules": [
    {
      "id": "mcp-view_show",
      "conditions": {
        "domain": "mcp",
        "server": "workbench",
        "tool": "view_show"
      },
      "decision": {
        "loose": "allow",
        "recommended": "allow",
        "strict": "allow"
      },
      "reason": "Read the current canvas and its artboard targets."
    },
    {
      "id": "mcp-view_set",
      "conditions": {
        "domain": "mcp",
        "server": "workbench",
        "tool": "view_set"
      },
      "decision": {
        "loose": "allow",
        "recommended": "allow",
        "strict": "allow"
      },
      "reason": "Change the selected artboard in the last-used canvas."
    },
    {
      "id": "mcp-annotation_list",
      "conditions": {
        "domain": "mcp",
        "server": "workbench",
        "tool": "annotation_list"
      },
      "decision": {
        "loose": "allow",
        "recommended": "allow",
        "strict": "allow"
      },
      "reason": "Read the user’s annotations from the canvas."
    },
    {
      "id": "mcp-config_show",
      "conditions": {
        "domain": "mcp",
        "server": "workbench",
        "tool": "config_show"
      },
      "decision": {
        "loose": "allow",
        "recommended": "allow",
        "strict": "allow"
      },
      "reason": "List configured spaces, pages, scenarios, sizes and lenses."
    },
    {
      "id": "mcp-page_screenshot",
      "conditions": {
        "domain": "mcp",
        "server": "workbench",
        "tool": "page_screenshot"
      },
      "decision": {
        "loose": "allow",
        "recommended": "allow",
        "strict": "allow"
      },
      "reason": "Capture a private page and optionally save the PNG in the project’s handoff folder."
    },
    {
      "id": "mcp-page_console",
      "conditions": {
        "domain": "mcp",
        "server": "workbench",
        "tool": "page_console"
      },
      "decision": {
        "loose": "allow",
        "recommended": "allow",
        "strict": "allow"
      },
      "reason": "Read a private page’s console entries."
    },
    {
      "id": "mcp-page_snapshot",
      "conditions": {
        "domain": "mcp",
        "server": "workbench",
        "tool": "page_snapshot"
      },
      "decision": {
        "loose": "allow",
        "recommended": "allow",
        "strict": "allow"
      },
      "reason": "Read a private page’s structure and text."
    },
    {
      "id": "mcp-page_check",
      "conditions": {
        "domain": "mcp",
        "server": "workbench",
        "tool": "page_check"
      },
      "decision": {
        "loose": "allow",
        "recommended": "allow",
        "strict": "allow"
      },
      "reason": "Check builds, console errors and layout at selected sizes."
    },
    {
      "id": "mcp-page_inspect",
      "conditions": {
        "domain": "mcp",
        "server": "workbench",
        "tool": "page_inspect"
      },
      "decision": {
        "loose": "allow",
        "recommended": "allow",
        "strict": "allow"
      },
      "reason": "Inspect matching elements, boxes and computed styles."
    },
    {
      "id": "mcp-page_sheet",
      "conditions": {
        "domain": "mcp",
        "server": "workbench",
        "tool": "page_sheet"
      },
      "decision": {
        "loose": "allow",
        "recommended": "allow",
        "strict": "allow"
      },
      "reason": "Capture one page at several sizes."
    },
    {
      "id": "mcp-page_compare",
      "conditions": {
        "domain": "mcp",
        "server": "workbench",
        "tool": "page_compare"
      },
      "decision": {
        "loose": "allow",
        "recommended": "allow",
        "strict": "allow"
      },
      "reason": "Compare two private targets or open page handles."
    },
    {
      "id": "mcp-page_start",
      "conditions": {
        "domain": "mcp",
        "server": "workbench",
        "tool": "page_start"
      },
      "decision": {
        "loose": "allow",
        "recommended": "allow",
        "strict": "allow"
      },
      "reason": "Start a private browser page that stays open for its MCP connection."
    },
    {
      "id": "mcp-page_list",
      "conditions": {
        "domain": "mcp",
        "server": "workbench",
        "tool": "page_list"
      },
      "decision": {
        "loose": "allow",
        "recommended": "allow",
        "strict": "allow"
      },
      "reason": "List the MCP connection’s private page handles."
    },
    {
      "id": "mcp-page_interact",
      "conditions": {
        "domain": "mcp",
        "server": "workbench",
        "tool": "page_interact"
      },
      "decision": {
        "loose": "allow",
        "recommended": "allow",
        "strict": "allow"
      },
      "reason": "Interact with a private page and run its project behavior."
    },
    {
      "id": "mcp-page_stop",
      "conditions": {
        "domain": "mcp",
        "server": "workbench",
        "tool": "page_stop"
      },
      "decision": {
        "loose": "allow",
        "recommended": "allow",
        "strict": "allow"
      },
      "reason": "Close a private page handle."
    },
    {
      "id": "mcp-image_inspect",
      "conditions": {
        "domain": "mcp",
        "server": "workbench",
        "tool": "image_inspect"
      },
      "decision": {
        "loose": "allow",
        "recommended": "allow",
        "strict": "allow"
      },
      "reason": "Read an image file’s format, size, transparency, padding and colours.",
      "requirements": {
        "field_paths": {
          "/file": {
            "absolute": true,
            "path": {
              "within": {
                "root": "read"
              }
            }
          }
        }
      },
      "on_unmet": {
        "decision": "ask",
        "message": "Use an absolute image path inside a Shield-approved read folder."
      }
    },
    {
      "id": "mcp-image_list",
      "conditions": {
        "domain": "mcp",
        "server": "workbench",
        "tool": "image_list"
      },
      "decision": {
        "loose": "allow",
        "recommended": "allow",
        "strict": "allow"
      },
      "reason": "Render a page privately and list how its images fit their displayed sizes."
    },
    {
      "id": "mcp-image_edit",
      "conditions": {
        "domain": "mcp",
        "server": "workbench",
        "tool": "image_edit"
      },
      "decision": {
        "loose": "allow",
        "recommended": "allow",
        "strict": "allow"
      },
      "reason": "Edit and encode an image, with optional mask files and a save destination.",
      "requirements": {
        "field_paths": {
          "/file": {
            "absolute": true,
            "path": {
              "within": {
                "root": "read"
              }
            }
          }
        }
      },
      "on_unmet": {
        "decision": "ask",
        "message": "Use an absolute image path inside a Shield-approved read folder."
      }
    },
    {
      "id": "mcp-docs_list",
      "conditions": {
        "domain": "mcp",
        "server": "workbench",
        "tool": "docs_list"
      },
      "decision": {
        "loose": "allow",
        "recommended": "allow",
        "strict": "allow"
      },
      "reason": "List the bundled Workbench documentation."
    },
    {
      "id": "mcp-docs_search",
      "conditions": {
        "domain": "mcp",
        "server": "workbench",
        "tool": "docs_search"
      },
      "decision": {
        "loose": "allow",
        "recommended": "allow",
        "strict": "allow"
      },
      "reason": "Search the bundled Workbench documentation."
    },
    {
      "id": "mcp-docs_read",
      "conditions": {
        "domain": "mcp",
        "server": "workbench",
        "tool": "docs_read"
      },
      "decision": {
        "loose": "allow",
        "recommended": "allow",
        "strict": "allow"
      },
      "reason": "Read a bundled Workbench documentation page."
    },
    {
      "id": "mcp-image-edit-masks",
      "conditions": {
        "domain": "mcp",
        "server": "workbench",
        "tool": "image_edit",
        "fields": {
          "/steps": {
            "not": {
              "exact": null
            }
          }
        }
      },
      "decision": {
        "loose": "allow",
        "recommended": "allow",
        "strict": "allow"
      },
      "requirements": {
        "field_paths": {
          "/steps": {
            "absolute": true,
            "path": {
              "within": {
                "root": "read"
              }
            },
            "each": "/mask/file"
          }
        }
      },
      "on_unmet": {
        "decision": "ask",
        "message": "Use an absolute image path inside a Shield-approved read folder."
      },
      "reason": "Check the image file named by every mask step."
    },
    {
      "id": "mcp-image-edit-output",
      "conditions": {
        "domain": "mcp",
        "server": "workbench",
        "tool": "image_edit",
        "fields": {
          "/out": {
            "not": {
              "exact": null
            }
          }
        }
      },
      "decision": {
        "loose": "allow",
        "recommended": "allow",
        "strict": "allow"
      },
      "requirements": {
        "field_paths": {
          "/out": {
            "absolute": true,
            "path": {
              "within": {
                "root": "write"
              }
            }
          }
        }
      },
      "on_unmet": {
        "decision": "ask",
        "message": "Use an absolute image path inside a Shield-approved write folder."
      },
      "reason": "Check where Workbench saves the edited images."
    },
    {
      "id": "mcp-unlisted",
      "fallback": true,
      "conditions": {
        "domain": "mcp",
        "server": "workbench",
        "tool": {
          "not": {
            "one_of": [
              "view_show",
              "view_set",
              "annotation_list",
              "config_show",
              "page_screenshot",
              "page_console",
              "page_snapshot",
              "page_check",
              "page_inspect",
              "page_sheet",
              "page_compare",
              "page_start",
              "page_list",
              "page_interact",
              "page_stop",
              "image_inspect",
              "image_list",
              "image_edit",
              "docs_list",
              "docs_search",
              "docs_read"
            ]
          }
        }
      },
      "decision": "allow",
      "reason": "Allow other tools from the verified Workbench server, such as tools added in later releases."
    }
  ]
}
